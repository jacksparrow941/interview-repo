 CDN purge API, surrogate keys. <b>Dynamic CDN</b>: Routes API requests optimally (Cloudflare Workers, Lambda@Edge for edge compute). Examples: CloudFront, Cloudflare, Fastly, Akamai."}, {"id": 107, "topic": "sysdesign", "q": "How do you prevent a single point of failure in a three-tier web application?", "options": ["A. Add more CPU to a single server", "B. Add redundancy at each tier: multiple app servers behind LB, DB primary+replicas, multi-AZ deployment", "C. Use faster hardware", "D. Increase timeout values"], "answer": "B", "explanation": "<b>Eliminating SPOF</b>: <b>Load balancer tier</b>: Multiple LBs (active-active or active-passive, Anycast). <b>Application tier</b>: Multiple stateless app servers behind LB, auto-scaling groups. <b>Database tier</b>: Primary + replicas, automatic failover (RDS Multi-AZ, Patroni for PostgreSQL). <b>Cache tier</b>: Redis Sentinel/Cluster. <b>Multi-AZ</b>: Deploy across availability zones. <b>Global</b>: Multi-region active-active (DynamoDB global tables, CockroachDB). Health checks + circuit breakers detect and route around failures."}, {"id": 108, "topic": "sysdesign", "q": "Design consideration for a global chat application (like WhatsApp) at scale:", "options": ["A. Store all messages in a single RDBMS", "B. WebSocket connections for real-time delivery, message queues for offline storage, NoSQL for message history", "C. HTTP polling every second per client", "D. Store messages in Redis only"], "answer": "B", "explanation": "<b>Chat System Design</b>: <b>Presence</b>: WebSocket connections to stateful chat servers; use Redis Pub/Sub to route messages between servers. <b>Message delivery</b>: Kafka for async delivery; offline messages stored in Cassandra (write-heavy, time-series). <b>Message history</b>: Cassandra (partition by conversationId, cluster by timestamp). <b>Media</b>: S3 + CDN. <b>Read receipts</b>: Async status updates via WebSocket. <b>Scale</b>: 1 chat server handles ~10k WebSocket connections; horizontal scaling with consistent hashing for connection routing."}, {"id": 109, "topic": "sysdesign", "q": "What is database federation (functional partitioning) in system design?", "options": ["A. Same as sharding — split rows across nodes", "B. Split database by function/domain (users DB, products DB, orders DB) — each serving a specific service", "C. Joining multiple databases", "D. Replicating across regions"], "answer": "B", "explanation": "<b>Federation</b>: Split a monolithic database into multiple databases, each responsible for a specific domain (users, products, orders). Each DB can be independently optimized, scaled, and backed up. <b>Benefits</b>: Reduced DB size, better performance per domain, fault isolation. <b>Drawbacks</b>: Cross-DB joins must happen at application level, complex transactions, operational overhead. First step in microservices DB decomposition. Different from sharding (splitting rows of the same table)."}, {"id": 110, "topic": "sysdesign", "q": "How would you design an autocomplete search system (like Google's search bar)?", "options": ["A. Query the full-text search index on every keystroke", "B. Trie/prefix tree in memory or specialized index (Redis Sorted Sets, Elasticsearch prefix query) with top-N results", "C. Linear scan of all records on each keystroke", "D. Use a hash map of all possible prefixes"], "answer": "B", "explanation": "<b>Autocomplete</b>: <b>Trie</b>: Store all prefixes; each node has top-K suggestions sorted by frequency. In-memory, fast O(L) lookup (L=prefix length). Rebuild periodically from search logs. <b>Redis Sorted Set</b>: Store prefix+term as member, frequency as score. <code>ZRANGEBYLEX</code> for prefix matching. <b>Elasticsearch</b>: Completion suggester with edge n-gram analyzer. <b>Scale</b>: Read-heavy, cache aggressively. <b>Real-time updates</b>: Kafka pipeline (query logs → frequency update → trie rebuild)."}, {"id": 111, "topic": "sysdesign", "q": "What is the role of a load balancer's health check?", "options": ["A. Monitor server hardware temperature", "B. Periodically probe backend servers and remove unhealthy ones from the rotation", "C. Authenticate client requests", "D. Cache responses for frequently requested paths"], "answer": "B", "explanation": "<b>Load balancer health checks</b>: LB probes backends (HTTP GET /health, TCP connect, or custom script) at intervals (e.g., every 5s). If N consecutive checks fail → server marked unhealthy → no traffic routed. On recovery → re-added to pool. Active health check: LB initiates probes. Passive health check: Monitor real traffic for errors. Configure: <b>interval</b>, <b>timeout</b>, <b>unhealthy threshold</b>, <b>healthy threshold</b>. Combine with application-level readiness probes."}, {"id": 112, "topic": "sysdesign", "q": "How do you handle distributed session management in a horizontally scaled application?", "options": ["A. Store sessions on individual app server memory", "B. Centralized session store (Redis) shared across all app server instances", "C. Use JWT and avoid sessions entirely — always valid", "D. Route users to the same server always (sticky sessions)"], "answer": "B", "explanation": "<b>Distributed sessions</b>: <b>Centralized store (Redis)</b>: All servers read/write sessions from Redis. Stateless app servers — any server can handle any user. Fast, scalable. <b>Sticky sessions (alternative)</b>: LB routes same user to same server — stateful, breaks if that server dies. <b>JWT (stateless)</b>: Session data in signed token, no server-side store — but can't revoke without a denylist. Production: Redis sessions with appropriate TTL + sliding expiration. Session data: user ID, roles, preferences."}, {"id": 113, "topic": "sysdesign", "q": "What is the two-phase commit (2PC) protocol and what is its main weakness?", "options": ["A. A write protocol for LSM trees", "B. A distributed consensus protocol ensuring all nodes commit or rollback; weakness is blocking when coordinator fails", "C. A caching invalidation strategy", "D. A replication protocol for databases"], "answer": "B", "explanation": "<b>2PC</b>: <b>Phase 1 (Prepare)</b>: Coordinator asks all participants 'can you commit?'. All reply Yes/No. <b>Phase 2 (Commit/Rollback)</b>: If all say Yes, coordinator sends Commit; otherwise Rollback. <b>Weakness</b>: Blocking protocol — if coordinator fails after Phase 1 (during Phase 2), participants are locked waiting (holding locks, blocking other transactions). <b>3PC</b>: Adds a pre-commit phase to reduce blocking but still not fault-tolerant under network partitions. Alternatives: Saga (compensating txns), Paxos/Raft for consensus."}, {"id": 114, "topic": "sysdesign", "q": "What is a Bloom Filter and where is it used in system design?", "options": ["A. A compression algorithm", "B. A probabilistic data structure for membership testing — no false negatives, possible false positives", "C. A distributed cache replacement policy", "D. A load balancing algorithm"], "answer": "B", "explanation": "<b>Bloom Filter</b>: Space-efficient probabilistic structure. <code>add(x)</code>: hash x with K functions, set bits. <code>contains(x)</code>: check all K bits — if any 0, definitely not in set; if all 1, probably in set (false positive possible). No false negatives. Use cases: <b>Cache penetration prevention</b> (check before DB query), <b>Cassandra</b> (bloom filter per SSTable to skip disk reads), <b>Chrome</b> (malicious URL check), <b>Email dedup</b>. Tune false positive rate with filter size."}, {"id": 115, "topic": "sysdesign", "q": "How does horizontal scaling differ from vertical scaling, and what's the limit of vertical scaling?", "options": ["A. No real difference", "B. Vertical = bigger machine (CPU/RAM); Horizontal = more machines. Vertical hits hardware limits and SPOF", "C. Horizontal is always faster", "D. Vertical is only for databases"], "answer": "B", "explanation": "<b>Vertical scaling (scale-up)</b>: Add CPU/RAM to existing machine. Simple — no code changes. Limit: hardware ceiling (max 128 cores, 12TB RAM on high-end), SPOF (one machine), exponential cost increase. <b>Horizontal scaling (scale-out)</b>: Add more machines. Linear cost, no SPOF, theoretically unlimited. Requires: stateless services (or distributed state), load balancing, distributed data. <b>Database vertical</b> scaling is common (large RDS instances) before moving to read replicas and then sharding."}, {"id": 116, "topic": "sysdesign", "q": "What is the purpose of a write-ahead log (WAL) in distributed databases like CockroachDB?", "options": ["A. Pre-write all queries before execution", "B. Log changes before applying — enables crash recovery, replication, and audit trails", "C. Cache all writes in memory", "D. Compress write operations"], "answer": "B", "explanation": "<b>WAL in distributed DBs</b>: Raft-based systems (CockroachDB, etcd, TiDB): each transaction creates WAL entries on the leader, replicated to followers before acknowledging commit. Provides: <b>Durability</b> (crash recovery from log replay), <b>Replication</b> (followers apply WAL entries), <b>PITR</b> (point-in-time recovery). Log-structured storage (Pebble in CockroachDB, RocksDB in TiKV) also writes sequentially to LSM before compaction."}, {"id": 117, "topic": "sysdesign", "q": "How would you design a news feed system (like Twitter's timeline)?", "options": ["A. Query all accounts the user follows in real-time on every load", "B. Fan-out on write (push to followers' feeds on post) or fan-out on read (pull and merge on timeline load)", "C. Store all tweets in a single sorted list", "D. Use full-text search on every timeline load"], "answer": "B", "explanation": "<b>News Feed</b>: <b>Fan-out on write (push)</b>: On new post, push to all followers' feed lists in Redis. Fast read (pre-computed). Problem: celebrities with millions of followers → slow write fanout. <b>Fan-out on read (pull)</b>: On timeline load, fetch from all followed accounts and merge/sort. Slow read for high-follow-count users. <b>Hybrid</b> (Twitter): Fan-out on write for normal users, fan-out on read for celebrities (high follower count). Store feed as Redis sorted set (score=timestamp). Background workers handle fanout."}, {"id": 118, "topic": "sysdesign", "q": "What is a service mesh's role in observability?", "options": ["A. It stores logs in a central database", "B. Automatically collects request metrics, distributed traces, and access logs at the proxy layer without code changes", "C. Provides application-level monitoring only", "D. Replaces APM tools"], "answer": "B", "explanation": "<b>Service Mesh Observability</b>: Envoy sidecar proxies automatically emit: <b>Metrics</b> (request rate, error rate, latency P50/P95/P99 per service pair), <b>Distributed traces</b> (propagate trace context, emit spans via Jaeger/Zipkin), <b>Access logs</b> (every request logged). Control plane (Istiod) aggregates via Prometheus + Grafana. The 'golden signals' (latency, traffic, errors, saturation) are available out-of-the-box. Integrates with OpenTelemetry for vendor-neutral instrumentation."}, {"id": 119, "topic": "sysdesign", "q": "What is back-of-envelope estimation and why is it critical in system design interviews?", "options": ["A. An approximation of server costs", "B. Quick capacity calculations to validate design choices and identify bottlenecks before over-engineering", "C. A formal mathematical proof", "D. A database query estimation"], "answer": "B", "explanation": "<b>Back-of-envelope</b>: Validates: Is a single server enough? Do we need caching? How much storage? Key numbers: 1M req/day = 12 req/sec. Read:Write = 10:1. Tweet = 100 bytes. Photo = 500KB. Video = 50MB. Memory: 64GB RAM. Disk: 4TB SSD. Network: 10Gbps. Example: 1M DAU, 10 tweets/day read = 10M reads/day = 116 reads/sec → single server fine. 1M photo uploads/day = 500KB × 1M = 500GB/day storage → need distributed storage."}, {"id": 120, "topic": "sysdesign", "q": "What is the difference between synchronous replication and asynchronous replication in databases?", "options": ["A. No difference", "B. Sync: primary waits for replica ack before committing (zero data loss, higher latency); Async: primary doesn't wait (low latency, potential data loss)", "C. Sync replication is always slower and less reliable", "D. Async replication guarantees zero data loss"], "answer": "B", "explanation": "<b>Synchronous replication</b>: Primary commits only after at least one replica confirms receipt. <b>Zero data loss</b> (RPO=0). Higher write latency (network round-trip to replica). PostgreSQL: <code>synchronous_commit=on</code>. <b>Asynchronous replication</b>: Primary commits immediately; replica catches up in background. Lower write latency, but if primary fails before replica syncs → data loss (RPO > 0). Most MySQL/PostgreSQL setups use async for performance. <b>Semi-sync</b> (MySQL): Wait for at least one replica to receive (not apply) the change."}, {"id": 121, "topic": "sysdesign", "q": "What is the purpose of a message queue in a payment processing system?", "options": ["A. Speed up payment authorization", "B. Decouple payment capture from downstream processing (ledger update, notifications, fraud check) ensuring reliability", "C. Store payment card data", "D. Replace the payment gateway"], "answer": "B", "explanation": "<b>Payment queue pattern</b>: After payment authorization (synchronous), publish event to Kafka. Downstream consumers: <b>Ledger service</b> (record transaction), <b>Notification service</b> (send receipt), <b>Fraud detection</b> (async risk scoring), <b>Analytics</b> (metrics). Benefits: <b>Durability</b> (if notification service is down, message is queued), <b>Retry logic</b> (on failure, message redelivered), <b>Decoupling</b> (payment service doesn't know about downstream). Critical: idempotent consumers (replay safety)."}, {"id": 122, "topic": "sysdesign", "q": "How would you design a distributed job scheduler (like cron at scale)?", "options": ["A. Use a single server running cron", "B. Leader election (ZooKeeper/etcd) for exactly-one execution, jobs in DB, distributed workers pull via queue", "C. Run jobs on all servers simultaneously", "D. Use application-level timers only"], "answer": "B", "explanation": "<b>Distributed Job Scheduler</b>: <b>Job store</b>: PostgreSQL/DynamoDB with next_run_at, status. <b>Scheduler</b>: Single leader (via leader election or DB row locking) polls for due jobs, enqueues to Kafka/SQS. <b>Workers</b>: Pull from queue, execute, update status. <b>Exactly-once</b>: DB locks or SQS FIFO dedup. <b>Failure handling</b>: Missed runs (backfill or skip), timeout detection, DLQ for failed jobs. Tools: Quartz (Java), Asynq (Go), Temporal, Airflow."}, {"id": 123, "topic": "sysdesign", "q": "What is a 'thundering herd' at the infrastructure level (not just cache)?", "options": ["A. Too many microservices", "B. Simultaneous restart/cold start of many instances triggers overwhelming load on downstream services", "C. Too many database indexes", "D. Network congestion from large payloads"], "answer": "B", "explanation": "<b>Thundering herd</b>: Many app instances restart simultaneously (deployment, crash) and all connect to DB, warm up caches, and make API calls at the same time → spike that can bring down dependencies. Solutions: <b>Staggered rollout</b> (rolling deployment), <b>Jittered startup delay</b> (random sleep on init), <b>Circuit breakers</b> (fail-fast if downstream overwhelmed), <b>Connection pool warming</b> (gradually accept traffic), Kubernetes <code>maxSurge</code>/<code>maxUnavailable</code> controls."}, {"id": 124, "topic": "sysdesign", "q": "What is the purpose of an API versioning strategy in microservices?", "options": ["A. Rate limit different API versions", "B. Allow backward-compatible evolution — old clients keep working while new clients use new API features", "C. Authenticate different client types", "D. Cache responses per version"], "answer": "B", "explanation": "<b>API Versioning strategies</b>: <b>URL path</b>: <code>/api/v1/users</code>, <code>/api/v2/users</code> — visible, simple. <b>Query param</b>: <code>?version=2</code>. <b>Header</b>: <code>Accept: application/vnd.api+json;version=2</code>. <b>Content negotiation</b>. Best practices: Never break existing clients (additive changes only), deprecate with sunset headers, maintain max 2 versions simultaneously, semantic versioning for major breaking changes. gRPC: backward-compatible protobuf evolution (add fields, don't remove)."}, {"id": 125, "topic": "sysdesign", "q": "What distinguishes a data lake from a data warehouse?", "options": ["A. Data lakes are smaller than data warehouses", "B. Data lake stores raw, unstructured data at scale; data warehouse stores structured, processed data optimized for queries", "C. Data warehouses are cheaper", "D. Data lakes are only for real-time processing"], "answer": "B", "explanation": "<b>Data Lake</b>: Raw data in any format (JSON, CSV, Parquet, video) in cheap object storage (S3, GCS). Schema-on-read (define schema when querying). Tools: AWS Athena, Spark, Presto/Trino. Flexible, cheap. <b>Data Warehouse</b>: Structured, cleaned, transformed data optimized for analytical queries. Schema-on-write. Tools: Redshift, BigQuery, Snowflake. Fast queries, expensive. <b>Data Lakehouse</b> (Delta Lake, Apache Iceberg): Combines both — raw storage with ACID transactions and query optimization."}, {"id": 126, "topic": "java", "q": "What is the difference between HashMap and ConcurrentHashMap in Java?", "options": ["A. No difference", "B. HashMap is not thread-safe; ConcurrentHashMap uses segment/bucket-level locking for thread-safe concurrent access", "C. ConcurrentHashMap is slower in all cases", "D. HashMap uses CAS operations"], "answer": "B", "explanation": "<b>HashMap</b>: Not thread-safe — concurrent modification can cause infinite loops (Java 7) or ConcurrentModificationException (Java 8). <b>ConcurrentHashMap</b>: Thread-safe without locking the entire map. Java 7: segment-level locks (16 segments). Java 8+: CAS operations + synchronized on individual buckets (bin-level locking). Allows concurrent reads + multiple concurrent writes. <b>Never</b> use HashMap in multi-threaded code without external synchronization. <code>Collections.synchronizedMap</code> locks the entire map on every operation — worse than ConcurrentHashMap."}, {"id": 127, "topic": "java", "q": "What is the Java Memory Model's 'happens-before' relationship?", "options": ["A. A garbage collection ordering rule", "B. A guarantee that all actions in thread A before writing to a volatile variable are visible to thread B after reading that variable", "C. A method execution ordering rule", "D. A JVM startup sequence"], "answer": "B", "explanation": "<b>Happens-before</b>: If action A happens-before action B, then A's effects are visible to B. Rules: 1) <b>volatile writes</b> happen-before subsequent reads of the same variable. 2) <b>synchronized release</b> happens-before subsequent lock acquire. 3) <b>Thread.start()</b> happens-before all actions in the started thread. 4) Thread actions happen-before <b>Thread.join()</b> returns. Without happens-before, CPUs/JIT can reorder instructions — leading to visibility bugs in multi-threaded code."}, {"id": 128, "topic": "java", "q": "In Java, what does 'volatile' keyword guarantee?", "options": ["A. Atomic compound operations like i++", "B. Visibility — reads/writes go to main memory; prevents CPU caching of the variable", "C. Thread-safe collections", "D. Immutability of the variable"], "answer": "B", "explanation": "<b>volatile</b>: 1) <b>Visibility</b>: Write to volatile immediately visible to all threads (no CPU cache). 2) <b>Ordering</b>: Prevents instruction reordering around the volatile read/write (full memory barrier). <b>Does NOT provide atomicity</b> for compound operations like <code>count++</code> (read-modify-write = three operations). For atomic compound ops, use <code>AtomicInteger</code>, <code>AtomicReference</code>, or <code>synchronized</code>. Use case: double-checked locking singleton (volatile + null check)."}, {"id": 129, "topic": "java", "q": "What is the purpose of Java's ForkJoinPool and how does it differ from ThreadPoolExecutor?", "options": ["A. No difference", "B. ForkJoinPool uses work-stealing — idle threads steal tasks from busy threads' queues; optimized for recursive divide-and-conquer tasks", "C. ForkJoinPool is only for I/O tasks", "D. ThreadPoolExecutor supports recursion; ForkJoinPool does not"], "answer": "B", "explanation": "<b>ForkJoinPool</b>: Each thread has its own deque (double-ended queue). Idle threads steal work from the tails of other threads' queues (work-stealing). Optimized for <b>recursive divide-and-conquer</b> (parallel sort, parallel stream). <code>Runtime.getRuntime().availableProcessors()</code> threads by default. <b>ThreadPoolExecutor</b>: Shared queue, all threads compete. Better for I/O-bound independent tasks. Java 8+: <code>CompletableFuture</code> uses ForkJoinPool.commonPool() by default. For I/O-heavy work, provide a dedicated executor to CompletableFuture."}, {"id": 130, "topic": "java", "q": "What is a Java virtual thread (Project Loom) and how does it improve scalability?", "options": ["A. A thread that runs on a virtual machine only", "B. A lightweight thread managed by the JVM (not OS), enabling millions of concurrent threads for I/O-bound workloads", "C. A deprecated feature from Java 8", "D. A thread pool for CPU-bound tasks only"], "answer": "B", "explanation": "<b>Virtual Threads</b> (Java 21, GA): JVM-managed threads, not 1:1 with OS threads. When a virtual thread blocks (I/O, sleep), the JVM unmounts it from the carrier (OS) thread and parks it — carrier thread picks up another virtual thread. Enables: <b>millions of concurrent threads</b> (vs. thousands of platform threads). Memory: ~KB per virtual thread (vs. ~1MB stack for platform threads). <b>Ideal for</b>: I/O-bound server workloads (HTTP servers, DB calls). Not beneficial for CPU-bound work. Spring Boot 3.2+ supports virtual threads."}, {"id": 131, "topic": "java", "q": "What is the difference between checked and unchecked exceptions in Java?", "options": ["A. No runtime difference", "B. Checked: must be declared/caught (compile-time check); Unchecked (RuntimeException): no forced handling", "C. Unchecked exceptions crash the JVM", "D. Checked exceptions are only in Java"], "answer": "B", "explanation": "<b>Checked exceptions</b>: Extend <code>Exception</code> (not RuntimeException). Must be caught or declared with <code>throws</code> — compile error otherwise. Examples: <code>IOException</code>, <code>SQLException</code>. <b>Unchecked exceptions</b>: Extend <code>RuntimeException</code>. No compile-time requirement. Examples: <code>NullPointerException</code>, <code>IllegalArgumentException</code>. Best practice (Clean Code): Use unchecked for programming errors; checked for recoverable conditions. Spring converts checked to unchecked (DataAccessException wraps SQLExceptions)."}, {"id": 132, "topic": "java", "q": "How does Java's Garbage Collector G1GC differ from ZGC?", "options": ["A. No difference in modern JVMs", "B. G1GC: region-based, pause-target configurable (typically 10-200ms); ZGC: concurrent, sub-millisecond pauses, scales to TB heaps", "C. ZGC is only for development; G1GC for production", "D. G1GC handles larger heaps than ZGC"], "answer": "B", "explanation": "<b>G1GC</b> (default since Java 9): Divides heap into equal-sized regions. Concurrent marking + stop-the-world collection. Configurable max pause: <code>-XX:MaxGCPauseMillis=200</code>. Good for most applications. <b>ZGC</b> (Java 15+ production-ready): Concurrent compaction — most GC work while app runs. Pause times: <1ms regardless of heap size (TB scale). Suitable for latency-critical services. <b>Shenandoah GC</b>: Similar to ZGC, RedHat developed. For Java 21+: Generational ZGC adds generational hypothesis for better throughput."}, {"id": 133, "topic": "java", "q": "What is the @Transactional propagation REQUIRES_NEW in Spring?", "options": ["A. Always joins the existing transaction", "B. Suspends the current transaction and starts a new independent transaction — commits/rollbacks independently", "C. Runs without any transaction", "D. Only applies if no transaction exists"], "answer": "B", "explanation": "<b>Spring @Transactional propagation types</b>: <b>REQUIRED</b> (default): Join existing or create new. <b>REQUIRES_NEW</b>: Suspend current, start new — commits/rolls back independently of caller's transaction. Use for: audit logging (must persist even if main tx rolls back). <b>SUPPORTS</b>: Join if exists, run without if not. <b>NOT_SUPPORTED</b>: Suspend and run non-transactionally. <b>MANDATORY</b>: Must join existing or throw. <b>NEVER</b>: Must not be in a transaction. <b>NESTED</b>: Savepoint within current transaction."}, {"id": 134, "topic": "java", "q": "What is CompletableFuture.thenCompose() vs thenApply() in Java?", "options": ["A. Identical methods", "B. thenApply: maps result (sync function); thenCompose: flat-maps to another CompletableFuture (avoids nesting)", "C. thenCompose runs synchronously", "D. thenApply is for error handling"], "answer": "B", "explanation": "<b>thenApply(Function)</b>: Transforms result synchronously — like <code>map</code>. Returns <code>CompletableFuture&lt;U&gt;</code> wrapping the transformed value. <b>thenCompose(Function&lt;T, CompletableFuture&lt;U&gt;&gt;)</b>: Chains async operations — like <code>flatMap</code>. Returns the inner CompletableFuture (flattened, no nesting). Use thenCompose when the transformation itself is async (returns a future). Without thenCompose, you'd get <code>CompletableFuture&lt;CompletableFuture&lt;U&gt;&gt;</code>. Similar to Reactor's <code>map</code> vs <code>flatMap</code>."}, {"id": 135, "topic": "java", "q": "What is Spring Boot Actuator and how is it used in production?", "options": ["A. A testing library for Spring", "B. Provides production-ready endpoints for health, metrics, info, and environment — integrates with Prometheus/Grafana", "C. A build tool plugin", "D. A database migration tool"], "answer": "B", "explanation": "<b>Spring Boot Actuator</b>: Exposes HTTP endpoints (or JMX) for operational visibility: <b>/actuator/health</b> (liveness/readiness, DB connectivity, Redis), <b>/actuator/metrics</b> (JVM, HTTP, DB pool, custom — via Micrometer), <b>/actuator/info</b> (build info, git commit), <b>/actuator/env</b> (config), <b>/actuator/loggers</b> (change log level at runtime). Micrometer: vendor-neutral metrics API → export to Prometheus, Datadog, CloudWatch. Secure endpoints with Spring Security (expose only /health publicly)."}, {"id": 136, "topic": "java", "q": "What is the difference between @RestController and @Controller in Spring?", "options": ["A. @RestController is for RESTful APIs only with no HTML", "B. @RestController = @Controller + @ResponseBody — auto-serializes return values to JSON/XML", "C. @Controller handles HTTP; @RestController handles WebSocket", "D. No functional difference in Spring 5+"], "answer": "B", "explanation": "<b>@Controller</b>: MVC controller — methods return view names (templates). Need <code>@ResponseBody</code> on methods to return JSON. <b>@RestController</b>: Shortcut for <code>@Controller + @ResponseBody</code> — every method returns JSON/XML (or whatever MessageConverter handles). Used for REST APIs. <b>@RequestMapping</b> on class sets base path. Method-level: <code>@GetMapping</code>, <code>@PostMapping</code>, <code>@PutMapping</code>, <code>@DeleteMapping</code>, <code>@PatchMapping</code>."}, {"id": 137, "topic": "java", "q": "What is the Java Stream API's 'lazy evaluation' and how does it affect performance?", "options": ["A. Streams execute all operations eagerly", "B. Intermediate operations (filter, map) are lazy — not executed until a terminal operation (collect, forEach) is called", "C. Lazy evaluation only applies to parallel streams", "D. Lazy evaluation causes memory issues"], "answer": "B", "explanation": "<b>Lazy evaluation</b>: Stream pipeline: <code>list.stream().filter(x -> x>5).map(x -> x*2).findFirst()</code> — filter and map are intermediate (lazy). Only executed when <code>findFirst()</code> (terminal) is called. Optimization: <b>short-circuit</b> — for findFirst/anyMatch, stops at first matching element (doesn't process entire list). For a 1M element list, if first element matches, only 1 element is processed. Performance: Avoid materializing intermediate collections; chain operations directly on the stream."}, {"id": 138, "topic": "java", "q": "What is the difference between Java's synchronized method and ReentrantLock?", "options": ["A. Identical in all scenarios", "B. ReentrantLock provides tryLock(), timed lock, interruptible lock, fairness, and multiple conditions — more flexible", "C. synchronized is always faster", "D. ReentrantLock does not support re-entrancy"], "answer": "B", "explanation": "<b>synchronized</b>: Simple, JVM-managed monitor lock. Auto-releases on exception. Cannot try to acquire without blocking. <b>ReentrantLock</b>: Explicit lock/unlock. <b>tryLock()</b>: Non-blocking attempt. <b>tryLock(timeout)</b>: Timed attempt. <b>lockInterruptibly()</b>: Can be interrupted while waiting. <b>Fairness</b>: FIFO ordering (prevents starvation). <b>Multiple conditions</b>: <code>lock.newCondition()</code> for fine-grained wait/signal. Must call <code>unlock()</code> in finally block. Use synchronized for simple cases; ReentrantLock for advanced scenarios."}, {"id": 139, "topic": "java", "q": "What is HikariCP and why is it preferred for database connection pooling in Spring Boot?", "options": ["A. An ORM framework for Java", "B. The fastest JDBC connection pool — minimal overhead, JMX/Metrics support, Spring Boot auto-configures it by default", "C. A PostgreSQL driver", "D. A query caching library"], "answer": "B", "explanation": "<b>HikariCP</b>: Default connection pool in Spring Boot 2.0+. <b>Why fastest</b>: Minimal bytecode, ConcurrentBag (lock-free bag for connection tracking), avoids synchronized blocks. Key configs: <code>maximumPoolSize</code> (default 10), <code>connectionTimeout</code> (30s), <code>idleTimeout</code> (10min), <code>maxLifetime</code> (30min). Exposes metrics via Micrometer for monitoring pool usage. Proper pool sizing formula: connections = (core_count * 2) + effective_spindle_count."}, {"id": 140, "topic": "java", "q": "What does Java's Optional class solve, and what is its misuse?", "options": ["A. Reduces memory usage", "B. Makes null handling explicit in API contracts; misuse: using Optional as method parameter or in collections", "C. Replaces all null checks", "D. Makes methods faster"], "answer": "B", "explanation": "<b>Optional</b>: Wraps a possibly-absent value. Forces caller to handle absence explicitly. Methods: <code>isPresent()</code>, <code>get()</code> (unsafe), <code>orElse(default)</code>, <code>orElseGet(supplier)</code>, <code>orElseThrow()</code>, <code>map()</code>, <code>flatMap()</code>, <code>filter()</code>, <code>ifPresent(consumer)</code>. <b>Misuse</b>: Optional as method parameter (use overloading instead), Optional in collections (use empty collection), Optional as class field (not serializable), <code>optional.get()</code> without isPresent check."}, {"id": 141, "topic": "golang", "q": "What is a goroutine and how does Go schedule them?", "options": ["A. A native OS thread", "B. A lightweight green thread managed by Go runtime; M:N scheduling — N goroutines multiplexed onto M OS threads", "C. An async/await function", "D. A coroutine requiring explicit yield"], "answer": "B", "explanation": "<b>Goroutine</b>: Start with <code>go func()</code>. Initial stack ~2KB (grows dynamically). Go runtime scheduler: <b>M:N model</b> — N goroutines scheduled on M OS threads (M = GOMAXPROCS, defaults to CPU count). Uses a <b>work-stealing scheduler</b> (similar to ForkJoinPool). Goroutine blocks on I/O → scheduler moves it off the OS thread → runs another goroutine on that thread. Can run millions of goroutines concurrently. No async/await needed — blocking I/O is non-blocking at the OS thread level."}, {"id": 142, "topic": "golang", "q": "What is a Go channel and what are the differences between buffered and unbuffered channels?", "options": ["A. A global variable for inter-goroutine communication", "B. Unbuffered: send blocks until receiver ready (synchronous); Buffered: send blocks only when buffer full", "C. Both behave identically", "D. Buffered channels are slower"], "answer": "B", "explanation": "<b>Channel</b>: Type-safe goroutine communication. <code>ch := make(chan int)</code> (unbuffered), <code>ch := make(chan int, 10)</code> (buffered, capacity 10). <b>Unbuffered</b>: sender blocks until receiver receives (rendezvous). <b>Buffered</b>: sender blocks only when buffer full; enables async send up to capacity. Closing a channel: receivers get zero value after drain. <code>select</code> statement: multiplexes over multiple channel ops. Pattern: use channels for communication, mutexes for shared state."}, {"id": 143, "topic": "golang", "q": "What does 'defer' do in Go and when is it executed?", "options": ["A. Delays function compilation", "B. Registers a function call to execute when the enclosing function returns (LIFO order)", "C. Runs a goroutine asynchronously", "D. Defers error handling to the caller"], "answer": "B", "explanation": "<b>defer</b>: Pushes function call onto a stack; executes in <b>LIFO order</b> when the enclosing function returns (normal return or panic). Common uses: <code>defer file.Close()</code>, <code>defer mu.Unlock()</code>, <code>defer wg.Done()</code>. Arguments evaluated at defer call time (not at execution time). Deferred functions see updated named return values. Multiple defers: last in, first out. Performance: minimal overhead in non-hot paths. Critical for guaranteed cleanup in Go."}, {"id": 144, "topic": "golang", "q": "What is Go's interface and how does implicit implementation differ from Java?", "options": ["A. Go interfaces require 'implements' declaration like Java", "B. Go: interfaces satisfied implicitly — any type with the required methods implements the interface, no declaration needed", "C. Go interfaces support inheritance", "D. Go interfaces must be registered with the runtime"], "answer": "B", "explanation": "<b>Go interfaces</b>: Duck typing — if a type has all methods of an interface, it implements it implicitly (no <code>implements</code> keyword). Example: <code>type Reader interface { Read([]byte) (int, error) }</code> — any type with <code>Read</code> method implements it. Benefits: Loose coupling, no circular imports. <b>Interface composition</b>: <code>type ReadWriter interface { Reader; Writer }</code>. <code>interface{}</code> (or <code>any</code> in Go 1.18+): empty interface — accepts any type. Type assertions: <code>val, ok := x.(string)</code>."}, {"id": 145, "topic": "golang", "q": "What is Go's approach to error handling vs Java's exception model?", "options": ["A. Go uses try/catch like Java", "B. Go returns errors as values (multiple return values); no exceptions — caller must explicitly check", "C. Go panics on all errors", "D. Go uses checked exceptions"], "answer": "B", "explanation": "<b>Go error handling</b>: Functions return <code>(result, error)</code>. Caller checks: <code>if err != nil { return err }</code>. <b>No exceptions</b>: No try/catch overhead. <b>errors.Is()</b>: Check error chain. <b>errors.As()</b>: Extract typed error. <b>fmt.Errorf('%w', err)</b>: Wrap errors with context. <b>panic/recover</b>: For truly unrecoverable errors (like assert violations) — analogous to unchecked exceptions, but convention is not to use for normal flow. Go 1.20+: <code>errors.Join()</code> for multiple errors."}, {"id": 146, "topic": "golang", "q": "What is the 'sync.WaitGroup' used for in Go?", "options": ["A. Synchronize access to shared memory", "B. Wait for a collection of goroutines to finish — counter-based synchronization", "C. Create a pool of goroutines", "D. Limit goroutine concurrency"], "answer": "B", "explanation": "<b>sync.WaitGroup</b>: Counter-based. <code>wg.Add(n)</code>: increment counter by n. <code>wg.Done()</code>: decrement by 1 (call in each goroutine, via defer). <code>wg.Wait()</code>: block until counter reaches 0. Pattern: <code>wg.Add(1); go func() { defer wg.Done(); doWork() }()</code>. Use for fan-out: launch N goroutines, wait for all to complete. <b>sync.Mutex</b>: mutual exclusion for shared state. <b>sync.Once</b>: Run exactly once (singleton init). <b>sync.Pool</b>: Object reuse pool (reduce GC pressure)."}, {"id": 147, "topic": "golang", "q": "What is Go's race detector and how is it used?", "options": ["A. A performance profiling tool", "B. Build/test flag (-race) that instruments code to detect concurrent access to shared variables at runtime", "C. A static analysis tool", "D. A memory leak detector"], "answer": "B", "explanation": "<b>Race detector</b>: <code>go run -race main.go</code>, <code>go test -race ./...</code>. Uses ThreadSanitizer (TSan) under the hood. Instruments all memory accesses at runtime; detects when two goroutines access the same variable concurrently and at least one is a write (without proper synchronization). Reports: goroutine stacks at the time of conflicting accesses. <b>Overhead</b>: ~5-10× slower, 5-10× more memory — run in CI, not production. Essential for correctness in concurrent Go code."}, {"id": 148, "topic": "golang", "q": "What is Go's context.Context used for?", "options": ["A. Storing global application configuration", "B. Carrying deadlines, cancellation signals, and request-scoped values across API boundaries and goroutines", "C. A dependency injection container", "D. A logging framework"], "answer": "B", "explanation": "<b>context.Context</b>: Propagates: <b>Cancellation</b> (<code>context.WithCancel</code>), <b>Deadline/Timeout</b> (<code>context.WithTimeout</code>, <code>context.WithDeadline</code>), <b>Values</b> (<code>context.WithValue</code> — for request-scoped data like traceID, userID). Pass as first argument to functions. Check <code>ctx.Done()</code> in long-running goroutines to honor cancellation. HTTP servers: <code>r.Context()</code> is cancelled when client disconnects. Critical for graceful shutdown, request timeout propagation across service calls."}, {"id": 149, "topic": "golang", "q": "What is a Go struct embedding and how does it differ from inheritance?", "options": ["A. Identical to Java inheritance", "B. Composition via embedding — promoted methods/fields, but no 'is-a' relationship (no polymorphism without interface)", "C. A way to inherit from multiple parents", "D. Syntactic sugar with no functional difference"], "answer": "B", "explanation": "<b>Embedding</b>: <code>type Dog struct { Animal }</code> — Dog 'embeds' Animal. Animal's fields and methods promoted to Dog. <code>dog.Speak()</code> calls Animal.Speak(). <b>Not inheritance</b>: Dog is NOT an Animal (no 'is-a'). No method overriding — embedding is delegation/forwarding. <b>Polymorphism</b> in Go: via interfaces. Multiple embedding: embed multiple structs. Conflict resolution: outer type's method takes precedence. Promotes composition over inheritance — a Go design philosophy."}, {"id": 150, "topic": "golang", "q": "What is Go's garbage collector and how does it impact latency?", "options": ["A. Go uses reference counting like Python", "B. Tricolor mark-and-sweep, concurrent — GC runs concurrently with the app, targeting sub-millisecond STW pauses", "C. Go has no garbage collector", "D. Go uses generational GC like Java"], "answer": "B", "explanation": "<b>Go GC</b>: Concurrent <b>tricolor mark-and-sweep</b>. Phases: 1) <b>Mark setup</b>: Short STW (~100μs). 2) <b>Concurrent marking</b>: GC and app run concurrently (write barrier tracks pointer changes). 3) <b>Mark termination</b>: Short STW to finalize. 4) <b>Concurrent sweep</b>: Reclaim memory while app runs. Target: total STW < 1ms. Tune with <code>GOGC</code> (default 100 = GC when heap doubles) and <code>GOMEMLIMIT</code> (Go 1.19+). Reduce GC pressure: reuse objects with <code>sync.Pool</code>, minimize allocations in hot paths."}];
const TOPICS = {"microservices": ["Microservices", "#6366f1"], "messaging": ["Messaging Queues", "#f59e0b"], "redis": ["Redis & Cache", "#ef4444"], "databases": ["Databases", "#10b981"], "sysdesign": ["System Design", "#3b82f6"], "java": ["Java", "#8b5cf6"], "golang": ["Go (Golang)", "#06b6d4"]};
let activeTopic = 'all';
let answered = 0, correct = 0;

function badge(t){{
  const [label,color] = TOPICS[t]||[t,'#64748b'];
  return `<span class="q-badge" style="background:${{color}}22;color:${{color}};border:1px solid ${{color}}44">${{label}}</span>`;
}}

function renderAll(qs){{
  const el = document.getElementById('qlist');
  if(!qs.length){{el.innerHTML='<div class="no-results">No questions found.</div>';return;}}
  el.innerHTML = qs.map(q=>`
  <div class="q-card" id="card-${{q.id}}">
    <div class="q-header">
      <span class="q-num">#${{q.id}}</span>
      ${{badge(q.topic)}}
      <div class="q-text">${{q.q}}</div>
    </div>
    <div class="q-options">${{q.options.map((o,i)=>`
      <div class="q-option" id="opt-${{q.id}}-${{i}}" onclick="choose(${{q.id}},${{i}},'${{q.answer}}')">${{o}}</div>`).join('')}}
    </div>
    <div class="q-actions">
      <button class="btn-show" onclick="toggleAnswer(${{q.id}})">Show Answer</button>
      <button class="btn-reset" onclick="resetCard(${{q.id}})">Reset</button>
    </div>
    <div class="q-answer" id="ans-${{q.id}}">
      <div class="answer-label">✓ Answer: ${{q.answer}}</div>
      <div class="answer-text">${{q.explanation}}</div>
    </div>
  </div>`).join('');
  document.getElementById('showing').textContent = qs.length;
}}

function choose(id,idx,ans){{
  const opts = ['A','B','C','D'];
  const chosen = opts[idx];
  const el = document.getElementById(`opt-${{id}}-${{idx}}`);
  if(el.classList.contains('correct')||el.classList.contains('wrong')) return;
  const isCorrect = chosen===ans;
  el.classList.add(isCorrect?'correct':'wrong');
  el.classList.add('selected');
  if(!isCorrect){{
    const corrIdx = opts.indexOf(ans);
    document.getElementById(`opt-${{id}}-${{corrIdx}}`).classList.add('correct');
  }}
  answered++;
  if(isCorrect) correct++;
  document.getElementById('answered').textContent=answered;
  document.getElementById('correct_count').textContent=correct;
  document.getElementById(`ans-${{id}}`).classList.add('open');
}}

function toggleAnswer(id){{
  const a = document.getElementById(`ans-${{id}}`);
  a.classList.toggle('open');
  const btn = a.previousElementSibling.querySelector('.btn-show');
  btn.textContent = a.classList.contains('open')?'Hide Answer':'Show Answer';
}}

function resetCard(id){{
  ['A','B','C','D'].forEach((_,i)=>{{
    const o = document.getElementById(`opt-${{id}}-${{i}}`);
    if(o) o.className='q-option';
  }});
  document.getElementById(`ans-${{id}}`).classList.remove('open');
}}

function filterAll(){{
  const s = document.getElementById('search').value.toLowerCase();
  const qs = QUESTIONS.filter(q=>
    (activeTopic==='all'||q.topic===activeTopic) &&
    (!s||q.q.toLowerCase().includes(s))
  );
  renderAll(qs);
}}

function setTopic(btn){{
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeTopic = btn.dataset.topic;
  filterAll();
}}

renderAll(QUESTIONS);
</script>
</body>
</html>
