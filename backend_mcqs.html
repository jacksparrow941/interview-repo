<script>
const QUESTIONS = [{"id": 1, "topic": "microservices", "q": "The Saga pattern in microservices is used to manage:", "options": ["A. Service discovery", "B. Distributed transactions across services without 2PC", "C. Load balancing between pods", "D. API gateway routing"], "answer": "B", "explanation": "<b>Saga pattern</b> breaks a distributed transaction into a sequence of local transactions. Each step publishes an event/message triggering the next. On failure, <b>compensating transactions</b> roll back completed steps. Two implementations: <b>Choreography</b> (services react to events — decoupled) and <b>Orchestration</b> (a saga orchestrator directs services — easier to observe). Avoids 2PC (two-phase commit) which causes distributed deadlocks. Used in order management at Amazon, payment flows at Stripe."}, {"id": 2, "topic": "microservices", "q": "Which pattern stops cascading failures by 'opening' when a downstream service is failing?", "options": ["A. Bulkhead", "B. Retry", "C. Circuit Breaker", "D. Sidecar"], "answer": "C", "explanation": "<b>Circuit Breaker</b> (Resilience4j, Hystrix): <b>Closed</b> = normal operation. <b>Open</b> = failures exceeded threshold → fail-fast without calling the service (returns error/fallback immediately). <b>Half-Open</b> = test recovery by allowing a few requests. Prevents cascading failure where a slow downstream causes thread pool exhaustion upstream. Configure: failure rate threshold (50%), slow call threshold, wait duration in open state."}, {"id": 3, "topic": "microservices", "q": "API Gateway's primary responsibility in a microservices architecture is:", "options": ["A. Database sharding", "B. Cross-cutting concerns: auth, rate-limiting, routing, SSL termination", "C. Event sourcing", "D. Schema migration"], "answer": "B", "explanation": "<b>API Gateway</b> is the single entry point for all clients. Handles: <b>Authentication/Authorization</b>, <b>Rate Limiting</b>, <b>SSL termination</b>, <b>Request routing</b>, <b>Load balancing</b>, <b>Response aggregation</b>, <b>Protocol translation</b> (REST↔gRPC), <b>Caching</b>. Examples: Kong, AWS API Gateway, NGINX, Envoy. Avoids duplicating cross-cutting concerns in every service."}, {"id": 4, "topic": "microservices", "q": "In Orchestration vs Choreography sagas, which is easier to observe/debug?", "options": ["A. Choreography — single event bus to monitor", "B. Orchestration — single orchestrator holds the full flow", "C. Both equally observable", "D. Neither supports debugging"], "answer": "B", "explanation": "<b>Orchestration</b>: A central saga orchestrator explicitly commands each service and tracks state — one place to see the full flow, easier to add monitoring. <b>Choreography</b>: Services react to events autonomously — loosely coupled, scales better, but tracking the overall flow requires correlating events across multiple services. Use orchestration for complex workflows (order processing); choreography for simple fan-out."}, {"id": 5, "topic": "microservices", "q": "Service Mesh (Istio) operates at which layer and requires what per-service change?", "options": ["A. Application layer; requires code changes", "B. Infrastructure layer via sidecar proxies; requires zero code changes", "C. Database layer; requires driver changes", "D. CI/CD layer; requires pipeline changes"], "answer": "B", "explanation": "<b>Service Mesh</b> uses <b>sidecar proxies</b> (Envoy) injected into each pod, transparent to the application. Provides: <b>mTLS</b> (mutual TLS between services), <b>observability</b> (metrics/traces/logs), <b>traffic management</b> (canary, A/B, retries, timeouts), <b>circuit breaking</b> — all without code changes. The control plane (Istiod) pushes config to sidecars. Separates operational concerns from business logic."}, {"id": 6, "topic": "microservices", "q": "Strangler Fig pattern is used to:", "options": ["A. Kill unused microservices", "B. Incrementally migrate a monolith to microservices without a big-bang rewrite", "C. Implement feature flags", "D. Manage service versioning"], "answer": "B", "explanation": "<b>Strangler Fig</b> (Martin Fowler): Intercept calls to the monolith and route extracted features to new microservices. The new system gradually 'strangles' the old one. Steps: 1) Identify feature, 2) Build microservice, 3) Route traffic via proxy/gateway, 4) Remove from monolith. Monolith stays live throughout — no risky big-bang migration. The API gateway is typically used as the strangler proxy."}, {"id": 7, "topic": "microservices", "q": "In CAP theorem, microservices typically favor which two properties?", "options": ["A. Consistency + Partition Tolerance", "B. Availability + Partition Tolerance (with eventual consistency)", "C. Consistency + Availability", "D. All three simultaneously"], "answer": "B", "explanation": "<b>CAP theorem</b>: In a distributed system, you can only guarantee 2 of 3: Consistency, Availability, Partition Tolerance. Since network partitions are inevitable, microservices must choose between C and A. Most favor <b>Availability + Partition Tolerance (AP)</b> with <b>eventual consistency</b> — fitting the BASE model (Basically Available, Soft state, Eventually consistent). Examples: Cassandra (AP), DynamoDB (AP). Banking systems may choose CP (Consistency + Partition Tolerance)."}, {"id": 8, "topic": "microservices", "q": "Blue-green deployment switches traffic by:", "options": ["A. Rolling pods one by one", "B. Switching the load balancer to point to the new environment instantly", "C. Using feature flags in code", "D. Canary releasing 5% at a time"], "answer": "B", "explanation": "<b>Blue-Green</b>: Two identical production environments — Blue (live) and Green (new). Once Green passes testing, the load balancer/DNS switches instantly to Green. Blue stays on standby for instant rollback. <b>Pros</b>: Zero downtime, instant rollback. <b>Cons</b>: Doubles infra cost during transition, DB schema changes need backward compatibility. Differs from <b>Canary</b> (gradual % shift) and <b>Rolling</b> (pod-by-pod in same cluster)."}, {"id": 9, "topic": "microservices", "q": "CQRS separates which two concerns?", "options": ["A. Sync and async communication", "B. Read models (queries) and write models (commands)", "C. Internal and external APIs", "D. Business logic and database layers"], "answer": "B", "explanation": "<b>CQRS</b>: <b>Command side</b> (writes: create/update/delete, often with Event Sourcing) and <b>Query side</b> (reads: optimized, denormalized read models). Each side scales, optimizes, and evolves independently. Query side updated via domain events from the command side. Combined with Event Sourcing enables time-travel queries. Used in high-read systems like order tracking dashboards at Amazon."}, {"id": 10, "topic": "microservices", "q": "Sidecar pattern runs auxiliary processes:", "options": ["A. As separate deployments", "B. In the same pod alongside the main container, sharing network and lifecycle", "C. In the database layer", "D. In the API gateway"], "answer": "B", "explanation": "<b>Sidecar pattern</b>: An auxiliary container in the same Kubernetes pod shares the main container's network namespace and lifecycle. Common sidecars: <b>Envoy proxy</b> (service mesh), <b>Fluentd</b> (log shipping), <b>Vault agent</b> (secret injection), <b>Jaeger agent</b> (tracing). Offloads cross-cutting concerns without polluting the main service's business logic."}, {"id": 11, "topic": "microservices", "q": "gRPC uses which serialization format by default?", "options": ["A. JSON", "B. XML", "C. Protocol Buffers (Protobuf)", "D. MessagePack"], "answer": "C", "explanation": "<b>gRPC</b> uses <b>Protocol Buffers (Protobuf)</b> — a binary format 3-10× smaller and 5-10× faster than JSON. Services defined in <code>.proto</code> files; code auto-generated for 10+ languages. Runs over <b>HTTP/2</b>: multiplexing, bidirectional streaming, header compression. Use gRPC for inter-service calls needing performance; REST+JSON for public/browser-facing APIs."}, {"id": 12, "topic": "microservices", "q": "Kubernetes Liveness vs Readiness probe — key difference:", "options": ["A. Identical purpose", "B. Liveness = restart if failing; Readiness = remove from service endpoints if failing (no restart)", "C. Liveness for DBs; Readiness for apps", "D. Liveness uses HTTP; Readiness uses TCP only"], "answer": "B", "explanation": "<b>Liveness probe</b>: Is the container alive? Failure → kubelet kills and restarts the container. Use for unrecoverable states (deadlock, OOM). <b>Readiness probe</b>: Is it ready for traffic? Failure → removed from Service endpoints, NOT restarted. Use during warmup (loading caches, DB connections). <b>Startup probe</b>: Delays liveness checks until app has fully started (slow-starting apps)."}, {"id": 13, "topic": "microservices", "q": "The Outbox pattern solves which specific distributed systems problem?", "options": ["A. Duplicate message processing", "B. The dual-write problem — atomically updating the DB and publishing an event", "C. Service discovery failures", "D. Circuit breaker state management"], "answer": "B", "explanation": "<b>Dual-write problem</b>: Writing to DB then publishing to Kafka can fail midway (inconsistent state). <b>Outbox pattern</b>: In the same DB transaction as business data, write the event to an <b>outbox table</b>. A CDC process (Debezium) reads the outbox table and publishes to Kafka. Atomicity guaranteed by the DB transaction. The event is eventually published regardless of Kafka availability."}, {"id": 14, "topic": "microservices", "q": "Bulkhead pattern isolates resources analogous to:", "options": ["A. Ship compartments — one flooded compartment doesn't sink the whole ship", "B. A database index", "C. A load balancer", "D. A caching layer"], "answer": "A", "explanation": "<b>Bulkhead</b>: Separate thread pools/connection pools/semaphores per downstream dependency. If Service B's thread pool is exhausted by slow calls, Service C's pool remains unaffected. Without bulkheads, a slow B exhausts the shared pool and starves all downstream calls. Implementation: Resilience4j Bulkhead, Hystrix thread pool isolation. Named after ship compartments preventing catastrophic flooding."}, {"id": 15, "topic": "microservices", "q": "Which is NOT a principle of a well-designed microservice?", "options": ["A. Single responsibility", "B. Independently deployable", "C. Shares a database with other services", "D. Loosely coupled"], "answer": "C", "explanation": "<b>Database-per-service</b> is a core microservice principle. Shared databases create tight coupling — a schema change in one service breaks others, prevents polyglot persistence, and creates hidden dependencies. Each service owns its data store exclusively. Communication between services happens via APIs or events, never via direct DB access."}, {"id": 16, "topic": "microservices", "q": "Idempotency in microservice APIs means:", "options": ["A. The API is stateless", "B. Multiple identical requests produce the same result as a single request", "C. The API supports multiple protocols", "D. The response is always cached"], "answer": "B", "explanation": "<b>Idempotency</b>: Critical for safe retries in distributed systems. HTTP: GET, PUT, DELETE are idempotent by spec; POST is not. Implementation: <b>Idempotency keys</b> (UUID per request, stored in DB) — if the same key arrives again, return the stored result without reprocessing. Stripe, Twilio use this. Without idempotency, retrying a failed payment call could double-charge customers."}, {"id": 17, "topic": "microservices", "q": "In distributed tracing, a 'span' represents:", "options": ["A. The entire trace from start to finish", "B. A single unit of work (one service call, DB query, etc.) within a trace", "C. A network hop between pods", "D. A database query plan"], "answer": "B", "explanation": "<b>Trace</b> = full journey across services (identified by TraceId). <b>Span</b> = a single named, timed operation (e.g., 'HTTP GET /users', 'DB query') within a trace. Spans form a parent-child tree. Tools: Jaeger, Zipkin, AWS X-Ray, Tempo. Standard: OpenTelemetry (OTel). Spans help identify which service/operation causes latency in complex call chains."}, {"id": 18, "topic": "microservices", "q": "Token Bucket rate limiting algorithm allows:", "options": ["A. Rejecting all requests above a fixed rate/second", "B. Bursts up to bucket capacity while enforcing average rate", "C. Queuing excess requests indefinitely", "D. Fixed window counting"], "answer": "B", "explanation": "<b>Token Bucket</b>: Bucket holds up to N tokens, refilled at rate R/sec. Each request consumes one token; empty bucket → reject/queue. Allows <b>bursts</b> (up to bucket size) while enforcing long-term average rate. Compare: <b>Leaky Bucket</b> = smooth output (no bursts); <b>Fixed Window</b> = simple count (boundary spike issues); <b>Sliding Window</b> = precise, no boundary spikes. Redis INCR+EXPIRE used for distributed rate limiting."}, {"id": 19, "topic": "microservices", "q": "The Fallback pattern provides:", "options": ["A. HTTP 500 on any failure", "B. A graceful degraded response when a downstream service is unavailable", "C. Infinite retries", "D. Service termination on failure"], "answer": "B", "explanation": "<b>Fallback</b>: When a service call fails (after retries/circuit opens), return a graceful degraded response instead of propagating the error. Examples: stale cached data, default/empty list, static response, simpler code path. Netflix: if recommendation service fails, return generic top-10 list instead of error page. Combined with Circuit Breaker: when circuit opens, fallback is invoked immediately."}, {"id": 20, "topic": "microservices", "q": "What is Event Sourcing's key benefit over traditional state storage?", "options": ["A. Faster writes than RDBMS", "B. Complete audit trail, time-travel queries, and ability to rebuild state from events", "C. Reduced storage costs", "D. Simpler data model"], "answer": "B", "explanation": "<b>Event Sourcing</b>: Store the full sequence of <b>immutable events</b> rather than current state. Benefits: <b>Complete audit trail</b> (compliance), <b>Time travel</b> (replay events to any point), <b>Debug production</b> by replaying events, <b>Event-driven integration</b>. Tools: EventStoreDB, Kafka as event store. Downside: current state requires replaying events or maintaining projections (eventual consistency)."}, {"id": 21, "topic": "microservices", "q": "Kubernetes Service type ClusterIP does which of the following?", "options": ["A. Exposes the service externally via cloud load balancer", "B. Provides a stable internal VIP accessible only within the cluster", "C. Forwards traffic to a fixed external IP", "D. Provides DNS to external services"], "answer": "B", "explanation": "<b>ClusterIP</b> (default): Stable internal VIP, accessible only within the cluster. DNS: <code>service-name.namespace.svc.cluster.local</code>. Other types: <b>NodePort</b> — static port on every node's IP. <b>LoadBalancer</b> — provisions cloud LB with external IP. <b>ExternalName</b> — maps to a DNS name. For inter-service communication, use ClusterIP."}, {"id": 22, "topic": "microservices", "q": "Service Registry (e.g., Consul, Eureka) maintains:", "options": ["A. Service source code", "B. A dynamic directory of available service instances and their network addresses", "C. Database schemas", "D. API documentation"], "answer": "B", "explanation": "<b>Service Registry</b>: Services register on startup, deregister on shutdown. Clients query for healthy instances. Two discovery patterns: <b>Client-side</b> (client queries registry and load-balances — Netflix Ribbon) and <b>Server-side</b> (client calls LB/router which queries registry — AWS ELB). Kubernetes uses DNS-based discovery built on etcd."}, {"id": 23, "topic": "microservices", "q": "Synchronous (REST/gRPC) communication is preferred when:", "options": ["A. Always use sync for reliability", "B. An immediate response is required to continue the operation (e.g., payment auth)", "C. The operation may take a long time", "D. Decoupling producers and consumers is important"], "answer": "B", "explanation": "<b>Sync</b>: Caller blocks until response. Use when: immediate response is needed, short-lived operations. <b>Async</b> (Kafka, RabbitMQ): Use for decoupling, high throughput, long-running tasks, fan-out to multiple consumers. Async improves resilience (services can be temporarily down) and scalability but adds complexity (eventual consistency, DLQ, idempotency)."}, {"id": 24, "topic": "microservices", "q": "Canary deployment's main advantage over blue-green is:", "options": ["A. No infrastructure cost", "B. Gradual risk reduction — small % of real traffic tests the new version before full rollout", "C. Faster deployment", "D. Eliminates testing needs"], "answer": "B", "explanation": "<b>Canary</b>: 1-5% of production traffic goes to the new version. Monitor metrics (error rate, latency, business KPIs). If healthy, gradually shift to 100%. If issues, instantly roll back. Tools: Argo Rollouts, Flagger, Istio traffic splitting. Lower risk than blue-green (full switch) — issues affect minimal users."}, {"id": 25, "topic": "microservices", "q": "Which consistency model do microservices typically implement due to CAP constraints?", "options": ["A. Strong consistency (linearizability)", "B. Eventual consistency", "C. Serializable isolation", "D. Read-your-writes consistency globally"], "answer": "B", "explanation": "<b>Eventual consistency</b>: The system guarantees that all replicas/services will eventually converge to the same state, but may temporarily differ. Fits the <b>BASE model</b> (Basically Available, Soft state, Eventually consistent). Implemented via: event-driven updates, saga compensations, conflict resolution (last-write-wins, vector clocks). Acceptable for most product features (feeds, recommendations) but not for financial ledgers (need strong consistency)."}, {"id": 26, "topic": "messaging", "q": "In Kafka, a consumer group provides:", "options": ["A. Shared message storage", "B. Horizontal scaling — each partition consumed by exactly one consumer in the group", "C. Priority queue semantics", "D. Message deduplication"], "answer": "B", "explanation": "<b>Consumer Group</b>: Multiple consumers sharing a group ID collaborate on a topic. Each partition assigned to exactly one consumer in the group — enabling parallel processing. 10 partitions + 5 consumers → 2 partitions per consumer. Adding more consumers than partitions is wasteful (some idle). Different consumer groups read the same topic independently (fan-out). Group Coordinator broker manages partition assignment."}, {"id": 27, "topic": "messaging", "q": "Kafka guarantees message ordering at which level?", "options": ["A. Across the entire topic", "B. Within a single partition", "C. Across all consumer groups", "D. Per producer instance"], "answer": "B", "explanation": "<b>Kafka ordering</b>: Strictly ordered within a partition; no ordering guarantee across partitions. To ensure ordered processing of related messages (e.g., same userId), use a consistent <b>partition key</b> — Kafka hashes it to the same partition. Increasing partition count later can break this (keys re-hash). For global ordering (rare), use a single partition — limits throughput."}, {"id": 28, "topic": "messaging", "q": "Key difference between Kafka and RabbitMQ message retention:", "options": ["A. No difference", "B. Kafka retains by time/size regardless of consumption; RabbitMQ deletes on consumer ack", "C. RabbitMQ retains longer", "D. Kafka deletes immediately after first read"], "answer": "B", "explanation": "<b>Kafka</b>: Commit log — messages retained by <b>time</b> (e.g., 7 days) or <b>size</b> regardless of consumption. Multiple consumer groups can re-read. Supports replay. <b>RabbitMQ</b>: Traditional broker — messages deleted once <b>acknowledged</b>. Designed for transient task queues. Kafka: better for event streaming, audit logs, replay. RabbitMQ: better for task queues, RPC patterns."}, {"id": 29, "topic": "messaging", "q": "'At-least-once' Kafka delivery means:", "options": ["A. Messages may be lost, never duplicated", "B. Messages delivered at least once; may be duplicated on consumer failure before offset commit", "C. Exactly one delivery guaranteed", "D. Messages may be lost and duplicated"], "answer": "B", "explanation": "<b>Delivery semantics</b>: <b>At-most-once</b> — commit offset before processing; loss possible. <b>At-least-once</b> — commit after processing; duplicates possible on crash before commit. <b>Exactly-once</b> — Kafka transactions + idempotent producer (enable.idempotence=true). Most systems use at-least-once + idempotent consumers (check if already processed before acting)."}, {"id": 30, "topic": "messaging", "q": "Kafka Dead Letter Queue (DLQ) routes messages that:", "options": ["A. Are deleted topics", "B. Fail processing after max retries — for manual inspection and replay", "C. Are frequently accessed", "D. Are archived old segments"], "answer": "B", "explanation": "<b>DLQ</b>: After N retries, a failed message is moved to a DLQ topic (e.g., <code>orders.dlq</code>) instead of blocking the partition. Ops teams inspect, fix the issue, replay from DLQ. Prevents <b>poison pill</b> messages from stopping all partition consumption. Configurable in Spring Kafka, Kafka Streams. Without DLQ, one bad message can halt processing permanently."}, {"id": 31, "topic": "messaging", "q": "Kafka replication factor=3, min.insync.replicas=2 means:", "options": ["A. All 3 replicas must ack writes", "B. Writes succeed if ≥2 ISR replicas acknowledge; survives 1 broker failure", "C. Data replicated to 2 brokers only", "D. Consumers read from 2 replicas simultaneously"], "answer": "B", "explanation": "<b>ISR (In-Sync Replicas)</b>: Replicas caught up to the leader. <b>min.insync.replicas=2</b>: Writes fail if fewer than 2 replicas are in-sync (durability guarantee). With <b>acks=all</b>: producer waits for all ISR acknowledgments. RF=3, min.ISR=2: lose 1 broker → still have 2 ISR → writes succeed. Lose 2 brokers → only 1 ISR → writes rejected (data safety preserved over availability)."}, {"id": 32, "topic": "messaging", "q": "RabbitMQ Fanout exchange routes messages to:", "options": ["A. Queues matching exact routing key", "B. Queues matching routing key pattern", "C. ALL bound queues unconditionally", "D. Queues matching header attributes"], "answer": "C", "explanation": "<b>RabbitMQ Exchange types</b>: <b>Direct</b> — exact routing key match. <b>Topic</b> — pattern match (* = one word, # = zero or more words). <b>Fanout</b> — broadcast to ALL bound queues (ignores routing key). <b>Headers</b> — match by message headers. Fanout for broadcast notifications (all services need to know). Topic most flexible: <code>order.#</code> matches <code>order.created</code>, <code>order.shipped</code>."}, {"id": 33, "topic": "messaging", "q": "Kafka Streams differs from a plain Kafka consumer in that it provides:", "options": ["A. They are identical", "B. Stateful stream processing: joins, aggregations, windowing, exactly-once — as a client library", "C. A separate broker cluster", "D. Batch processing only"], "answer": "B", "explanation": "<b>Kafka Streams</b>: Lightweight Java library (no separate cluster). Features: <b>Stateful operations</b> (joins, aggregations with local RocksDB state stores), <b>Windowing</b> (tumbling, hopping, session), <b>Exactly-once</b>, <b>Interactive queries</b>. A plain consumer just reads messages. Streams provides a DSL for transformations and aggregations. Alternatives: Apache Flink (more powerful, separate cluster)."}, {"id": 34, "topic": "messaging", "q": "Kafka idempotent producer (enable.idempotence=true) prevents:", "options": ["A. Message loss", "B. Duplicate messages from producer retries", "C. Out-of-order delivery", "D. Consumer rebalancing"], "answer": "B", "explanation": "<b>Idempotent Producer</b>: Each producer gets a <b>Producer ID (PID)</b>; each message gets a <b>sequence number</b>. Broker deduplicates messages with same PID+sequence. Prevents duplicates from producer retrying after network error where broker already received the message. Building block for Kafka transactions (exactly-once semantics)."}, {"id": 35, "topic": "messaging", "q": "A Kafka partition offset is:", "options": ["A. Number of partitions in a topic", "B. A monotonically increasing integer identifying each message's position within a partition", "C. The lag between producer and consumer", "D. The replication factor"], "answer": "B", "explanation": "<b>Offset</b>: Sequential integer per partition (starts at 0). Consumers track position by committing the last processed offset to <code>__consumer_offsets</code> topic. On restart, consumer resumes from committed offset. <b>Consumer lag</b> = latest broker offset − committed consumer offset. Monitor with Kafka Burrow, Prometheus. High lag indicates consumers not keeping up."}, {"id": 36, "topic": "messaging", "q": "Fanout (pub/sub) vs Work Queue difference:", "options": ["A. Fanout delivers to one; work queue to all", "B. Fanout delivers a copy to every subscriber; work queue delivers each message to exactly one worker", "C. Equivalent", "D. Work queue has priority; fanout does not"], "answer": "B", "explanation": "<b>Fanout</b>: One publisher, many subscribers — each gets a copy (broadcast). Use for event notifications (user created → email service AND notification service AND analytics). <b>Work Queue</b>: Each message processed by exactly one worker — round-robin load distribution. Use for task queuing (image resize jobs). Kafka: multiple consumer groups = fanout; single consumer group = work queue."}, {"id": 37, "topic": "messaging", "q": "Back-pressure in message-driven systems is:", "options": ["A. Network pressure from too many connections", "B. A mechanism for consumers to signal producers to slow down when overwhelmed", "C. DLQ filling up", "D. Replication lag"], "answer": "B", "explanation": "<b>Back-pressure</b>: When consumers process slower than producers send, the queue grows. Reactive systems (Project Reactor, RxJava) handle this with operators: <code>onBackpressureDrop</code>, <code>onBackpressureBuffer</code>, <code>onBackpressureLatest</code>. In Kafka, consumers control rate via poll interval. Without back-pressure handling, unbounded queues cause OOM or latency spikes."}, {"id": 38, "topic": "messaging", "q": "A Kafka 'compacted topic' retains:", "options": ["A. High-compression-ratio messages", "B. Only the latest value per key, removing older records with the same key", "C. A topic with fewer partitions", "D. Read-only archival data"], "answer": "B", "explanation": "<b>Log Compaction</b>: Removes older records with the same key, keeping only the latest value. Null value = tombstone (key deleted eventually). Use cases: <b>Changelog topics</b> (Kafka Streams state store backups), <b>Entity state topics</b> (latest user profile per userId). Different from time/size-based retention which deletes old segments regardless of key."}, {"id": 39, "topic": "messaging", "q": "For a simple task queue (one task → one worker) in AWS, which is operationally simpler?", "options": ["A. Kafka — exactly-once native", "B. SQS — managed work queue with visibility timeout", "C. RabbitMQ only", "D. SQS FIFO for ordering; Kafka for reliability"], "answer": "B", "explanation": "<b>SQS</b>: Managed, serverless. <b>Visibility timeout</b>: Message hidden after receive; consumer must delete after processing or it reappears. <b>SQS FIFO</b>: Strict ordering + exactly-once (dedup ID). Simpler ops than Kafka. <b>Kafka</b>: Better for event streaming, replay, high throughput, multiple consumer groups, audit log. For simple task queues in AWS, SQS wins on operational simplicity."}, {"id": 40, "topic": "messaging", "q": "A 'poison pill' message in messaging systems is:", "options": ["A. A message killing the producer", "B. A consistently failing message that blocks the queue/partition", "C. A security exploit", "D. An encrypted undeserializable message"], "answer": "B", "explanation": "<b>Poison pill</b>: A malformed message the consumer always fails to process. In Kafka: blocks the partition (no progress). In RabbitMQ: infinite requeue-redeliver loop. <b>Solutions</b>: Dead Letter Queue (after N retries), exponential backoff, schema validation before processing. Without DLQ, one poison pill silently stalls all consumption on that partition/queue."}, {"id": 41, "topic": "messaging", "q": "Kafka's '__consumer_offsets' internal topic stores:", "options": ["A. Broker configuration", "B. Consumer group offset commits for fault-tolerant offset tracking", "C. Topic metadata", "D. Schema registry data"], "answer": "B", "explanation": "<b>__consumer_offsets</b>: Internal Kafka topic (50 partitions default) storing committed offsets for all consumer groups. When a consumer commits, it writes here. On restart, reads from here to resume. Moved from ZooKeeper to Kafka itself in v0.9 for better reliability. Compacted — only latest offset per (group, topic, partition) retained."}, {"id": 42, "topic": "messaging", "q": "What is Kafka KRaft mode (KIP-500)?", "options": ["A. A new compression algorithm", "B. Removes ZooKeeper dependency — Kafka manages its own metadata via Raft consensus", "C. A new consumer rebalancing protocol", "D. Kubernetes-native Kafka operator"], "answer": "B", "explanation": "<b>KRaft (Kafka Raft)</b>: Replaces ZooKeeper with Kafka's own Raft-based metadata quorum (<code>@metadata</code> topic). Brokers themselves elect a controller via Raft. Benefits: Simpler deployment (one system instead of two), better scalability (millions of partitions), faster failover. Available in production from Kafka 3.3+. ZooKeeper was responsible for broker metadata, controller election, topic metadata, and ACLs."}, {"id": 43, "topic": "messaging", "q": "To avoid Kafka consumer group rebalancing from slow processing, you should:", "options": ["A. Increase partition count", "B. Tune max.poll.interval.ms, reduce max.poll.records, or process asynchronously", "C. Decrease message size", "D. Use smaller consumer group"], "answer": "B", "explanation": "<b>Rebalancing</b> triggered when a consumer doesn't poll within <code>max.poll.interval.ms</code> (default 5min). If processing is slow: reduce <code>max.poll.records</code>, increase <code>max.poll.interval.ms</code>, or process records in async thread pools (with careful offset management). Use <b>CooperativeStickyAssignor</b> to minimize partition movement during rebalances."}, {"id": 44, "topic": "messaging", "q": "Kafka Schema Registry (Confluent) is used for:", "options": ["A. Storing broker configs", "B. Enforcing schema compatibility and storing Avro/Protobuf/JSON schemas", "C. REST API for Kafka", "D. Managing ACLs"], "answer": "B", "explanation": "<b>Schema Registry</b>: Central repository for message schemas. Producers serialize with schema; consumers deserialize using schema ID embedded in message. Enforces evolution rules: <b>BACKWARD</b> (new schema reads old data), <b>FORWARD</b> (old schema reads new data), <b>FULL</b> (both). Prevents silent breaking changes in distributed teams. Schemas versioned and cached by clients."}, {"id": 45, "topic": "messaging", "q": "Kafka producer `linger.ms` controls:", "options": ["A. Time to wait for broker ack", "B. Time to accumulate messages in a batch before sending", "C. Message TTL in the topic", "D. Broker connection timeout"], "answer": "B", "explanation": "<b>linger.ms</b> (default 0): Wait up to this duration to accumulate messages in a batch. 0 = send immediately (low latency). >0 = batch more messages → fewer network requests → higher throughput (slight latency cost). Combined with <b>batch.size</b>: send when either linger.ms expires or batch.size reached. For high throughput: linger.ms=5-20ms + larger batch.size + snappy/lz4 compression."}, {"id": 46, "topic": "messaging", "q": "Consumer lag in Kafka is:", "options": ["A. Slow broker replication", "B. Latest produced offset minus consumer's committed offset", "C. Number of inactive consumers", "D. Disk I/O lag"], "answer": "B", "explanation": "<b>Consumer lag</b>: High lag = consumers not keeping up with producers. Causes: processing too slow, insufficient consumers, expensive transformations. <b>Monitor</b>: Kafka Burrow, Prometheus kafka-consumer-group exporter, Datadog. <b>Remediate</b>: Add consumers (up to partition count), optimize processing, increase batch size, scale horizontally. Alert on growing trend, not just absolute value."}, {"id": 47, "topic": "messaging", "q": "NATS vs Kafka — when to prefer NATS?", "options": ["A. For long-retention event sourcing", "B. For low-latency request-reply, IoT, or simple pub/sub with simpler ops", "C. For high-throughput log processing", "D. For multi-consumer fan-out with replay"], "answer": "B", "explanation": "<b>NATS</b>: Ultra-lightweight Go-based messaging. <b>Core NATS</b>: Fire-and-forget (no persistence). <b>NATS JetStream</b>: Adds persistence and at-least-once delivery. Prefer NATS for: sub-millisecond latency, simple pub/sub or request-reply, IoT/edge, simpler ops (single binary). Kafka excels at: high throughput, long retention, complex stream processing, large engineering teams."}, {"id": 48, "topic": "messaging", "q": "Kafka transactions enable:", "options": ["A. ACID transactions with a backing database", "B. Atomic write to multiple partitions + offset commit across a read-process-write pipeline (exactly-once)", "C. Financial transaction processing", "D. Batch import of messages"], "answer": "B", "explanation": "<b>Kafka Transactions</b>: Producer atomically writes to multiple partitions (across topics) and commits consumer offsets — all succeed or all fail. Use case: Read from topic A, transform, write to topic B, commit offset for A — atomically. Requires: idempotent producer + <code>transactional.id</code> + consumer <code>isolation.level=read_committed</code>. Delivers EOS (Exactly-Once Semantics)."}, {"id": 49, "topic": "messaging", "q": "Message broker's primary benefit over direct REST calls for inter-service communication:", "options": ["A. Smaller message size", "B. Temporal decoupling — producer and consumer need not be online simultaneously", "C. Faster delivery than REST", "D. Built-in encryption"], "answer": "B", "explanation": "<b>Temporal decoupling</b>: Producer sends messages regardless of consumer availability. Messages durably stored. Consumer processes when ready. Benefits: <b>Resilience</b> (consumer outage doesn't affect producer), <b>Elasticity</b> (consumers scale independently), <b>Spiky traffic handling</b> (broker absorbs bursts), <b>Fan-out</b> (one message → multiple consumers). REST: synchronous coupling — if consumer is down, producer call fails."}, {"id": 50, "topic": "messaging", "q": "RabbitMQ message ordering is guaranteed when:", "options": ["A. Always across all consumers", "B. Per-queue with a single consumer; breaks with competing consumers or priority queues", "C. Only with direct exchange", "D. Never guaranteed"], "answer": "B", "explanation": "<b>RabbitMQ ordering</b>: FIFO per queue with a single consumer. <b>Multiple competing consumers</b>: ordering not guaranteed (different speeds). <b>Priority queues</b>: break FIFO intentionally. For strict ordering: single consumer per queue, or use Kafka (per-partition ordering with consumer groups)."}, {"id": 51, "topic": "redis", "q": "Redis is single-threaded for command execution. This means:", "options": ["A. Slower than multi-threaded systems", "B. No lock contention — atomic ops without mutex, achieving 100k+ ops/sec on a single core", "C. Only one client can connect at a time", "D. Cannot handle concurrent requests"], "answer": "B", "explanation": "<b>Redis single-threaded model</b>: Command processing on one thread → no mutex/lock needed → operations are atomic. Uses event loop (epoll/kqueue) to handle thousands of connections concurrently. Throughput: <b>100k-1M+ ops/sec</b> on commodity hardware. Redis 6+ added <b>I/O threading</b> (multi-threaded network I/O, single-threaded command execution). Avoids lock contention complexity."}, {"id": 52, "topic": "redis", "q": "Best Redis data structure for a leaderboard with scores:", "options": ["A. String", "B. List", "C. Sorted Set (ZSet)", "D. Hash"], "answer": "C", "explanation": "<b>Sorted Set (ZSet)</b>: Each member has a floating-point <b>score</b>; members ordered by score. <code>ZADD leaderboard 1500 'user1'</code>, <code>ZRANGE leaderboard 0 9 REV WITHSCORES</code> (top 10), <code>ZRANK leaderboard 'user1'</code>. Internal: <b>skip list + hash table</b> — O(log N) add/update/rank. Use cases: leaderboards, rate limiting (sliding window), priority queues."}, {"id": 53, "topic": "redis", "q": "What is the Redis 'cache stampede' (thundering herd) problem?", "options": ["A. Too many writes to a single key", "B. Many concurrent requests for an expired cache key simultaneously hit the database", "C. Redis running out of memory", "D. Network congestion between nodes"], "answer": "B", "explanation": "<b>Cache stampede</b>: Hot key expires → many concurrent requests find no cache → all hit DB simultaneously → DB spike. Solutions: <b>Probabilistic early expiration</b> (XFetch), <b>Mutex/locking</b> (SET NX EX — first request fetches, others wait), <b>Jittered TTL</b> (add random offset to expiry), <b>Background refresh</b> (async refresh before expiry)."}, {"id": 54, "topic": "redis", "q": "Redis persistence mode balancing performance and durability:", "options": ["A. No persistence", "B. RDB (snapshot) only", "C. AOF with fsync every second", "D. AOF with fsync always"], "answer": "C", "explanation": "<b>Redis Persistence</b>: <b>RDB</b>: Full snapshot periodically — fast restarts, minutes of data loss window. <b>AOF fsync=always</b>: durable like traditional DB, slow. <b>AOF fsync=everysec</b>: 1-second max data loss, good performance — best trade-off. <b>AOF fsync=no</b>: OS decides, fastest, up to 30s loss. <b>RDB+AOF</b>: best durability. Pure caches: no persistence (faster)."}, {"id": 55, "topic": "redis", "q": "Redis Sentinel's primary role is:", "options": ["A. Data sharding", "B. HA — monitors master, promotes replica on master failure", "C. Data persistence", "D. Cache warming"], "answer": "B", "explanation": "<b>Redis Sentinel</b>: Quorum of sentinels monitor master health. If master unreachable (quorum agrees), a replica is promoted automatically. Provides: Monitoring, Notification, Automatic failover, Configuration provider (clients ask Sentinel for master address). Differs from <b>Redis Cluster</b>: Cluster = horizontal sharding + HA; Sentinel = HA only (no sharding)."}, {"id": 56, "topic": "redis", "q": "Redis Cluster uses how many hash slots?", "options": ["A. 1024", "B. 4096", "C. 16384", "D. 65536"], "answer": "C", "explanation": "<b>Redis Cluster</b>: <b>16384 hash slots</b> (0-16383). Key → slot: <code>CRC16(key) mod 16384</code>. Slots distributed among master nodes. With 3 masters: ~5461 slots each. Hash tags: <code>{'{user}'}:profile</code> and <code>{'{user}'}:session</code> force same slot. Minimum 3 masters for quorum. Each master can have N replicas for HA."}, {"id": 57, "topic": "redis", "q": "SETNX command is used for:", "options": ["A. Set key with no expiry", "B. Atomic SET if Not eXists — foundation for distributed locking", "C. Set multiple keys at once", "D. Set with no TTL override"], "answer": "B", "explanation": "<b>SETNX</b>: Atomically sets a key only if it doesn't exist. Returns 1 (set) or 0 (already exists). Modern equivalent: <code>SET key value NX EX seconds</code> (atomic set-if-not-exists + TTL). Critical for distributed locks — always include TTL to prevent deadlock if lock holder crashes. <b>Redlock algorithm</b> extends this to multiple Redis nodes for fault-tolerant locking."}, {"id": 58, "topic": "redis", "q": "Write-through caching strategy means:", "options": ["A. Write to cache only; async sync to DB", "B. Write to cache and DB synchronously — always consistent", "C. Write to DB only; cache populated on read miss", "D. Write to write-behind queue"], "answer": "B", "explanation": "<b>Write-through</b>: Every write updates both cache and DB synchronously. <b>Pros</b>: Cache always consistent, no stale data. <b>Cons</b>: Higher write latency (two writes), writes to unused data pollute cache. <b>Write-around</b>: Bypass cache on write. <b>Write-back</b>: Write to cache only, async flush to DB — best write performance, risk of data loss. Choose based on read/write ratio and consistency needs."}, {"id": 59, "topic": "redis", "q": "Redis HyperLogLog is used for:", "options": ["A. Time-series data", "B. Approximate cardinality counting (~12KB memory regardless of set size)", "C. Geospatial indexing", "D. Full-text search"], "answer": "B", "explanation": "<b>HyperLogLog</b>: Probabilistic data structure for approximate count distinct. Error: ~0.81%. Memory: fixed ~12KB regardless of cardinality (vs. exact set growing linearly). Commands: <code>PFADD visits user1</code>, <code>PFCOUNT visits</code>, <code>PFMERGE</code>. Use: unique visitors, distinct IPs, distinct events — when approximate counts are acceptable."}, {"id": 60, "topic": "redis", "q": "Redis Pub/Sub limitation vs Redis Streams:", "options": ["A. Identical to Streams", "B. Pub/Sub is fire-and-forget — messages lost if subscriber offline; Streams add persistence and consumer groups", "C. Streams are slower", "D. Pub/Sub supports replay"], "answer": "B", "explanation": "<b>Redis Pub/Sub</b>: Broadcast to current subscribers. No persistence — offline subscriber misses messages. No replay, no acknowledgment (at-most-once). <b>Redis Streams</b> (5.0+): Append-only log, persisted, consumer groups with offset tracking, <code>XACK</code> for acknowledgment, replay from any offset. Use Streams when you need durability and consumer groups; Pub/Sub for ephemeral real-time notifications."}, {"id": 61, "topic": "redis", "q": "Redis eviction policy 'allkeys-lfu' evicts:", "options": ["A. Least Recently Used across all keys", "B. Least Frequently Used across all keys — better for skewed access patterns", "C. Keys with shortest TTL", "D. Random keys"], "answer": "B", "explanation": "<b>Redis eviction policies</b>: <b>allkeys-lru</b>: LRU across all keys. <b>allkeys-lfu</b>: LFU (Redis 4.0+) — better when popular keys should stay longer. <b>volatile-lru/lfu</b>: Only keys with TTL. <b>volatile-ttl</b>: Evict shortest TTL. <b>noeviction</b>: Error on new writes. <b>allkeys-random</b>: Random. Redis uses approximate LRU (samples N random keys)."}, {"id": 62, "topic": "redis", "q": "The Redlock algorithm provides:", "options": ["A. Distributed rate limiting", "B. Fault-tolerant distributed locking across N independent Redis nodes (majority quorum)", "C. Consistent hashing", "D. Cross-datacenter replication"], "answer": "B", "explanation": "<b>Redlock</b>: Use N (typically 5) independent Redis nodes. Acquire lock on majority (N/2+1) with same key+TTL within lock validity time. Fault-tolerant: survives N/2 node failures. Lock validity = TTL − elapsed acquisition time. Controversial (Kleppmann's critique re: clock assumptions). Use ZooKeeper/etcd for stricter guarantees with fencing tokens."}, {"id": 63, "topic": "redis", "q": "Cache-Aside (Lazy Loading) pattern flow is:", "options": ["A. Write to cache, cache writes to DB", "B. Check cache → miss → fetch from DB → populate cache → return; next read hits cache", "C. Preload all DB data on startup", "D. Async cache writes"], "answer": "B", "explanation": "<b>Cache-Aside</b>: 1) Check cache. 2) <b>Hit</b>: return cached value. 3) <b>Miss</b>: fetch from DB, store in cache with TTL, return. App controls cache population (lazy — only cache what's requested). <b>Pros</b>: Cache only hot data, resilient to cache failures (fallback to DB). <b>Cons</b>: Cache miss penalty (extra DB call), potential stale data, stampede on first miss."}, {"id": 64, "topic": "redis", "q": "Hot key problem in Redis is caused by:", "options": ["A. A key with a very long value", "B. One key receiving disproportionate traffic, overwhelming the single shard that owns it", "C. A key with no TTL", "D. A key causing cache stampede"], "answer": "B", "explanation": "<b>Hot key</b>: One Redis key (e.g., popular product) receiving millions of req/sec, exceeding single node capacity. Mitigations: <b>Read replicas</b>, <b>Local in-process cache</b> (short TTL), <b>Key sharding</b> (replicate under <code>product:123:shard{0-9}</code>), <b>Redis Cluster READONLY</b> on replicas. Monitor with <code>OBJECT FREQ</code> (LFU mode) or Redis hotkeys option."}, {"id": 65, "topic": "redis", "q": "To atomically increment a counter and set expiry in Redis, the safest approach is:", "options": ["A. INCR then EXPIRE (two separate commands)", "B. SET with NX and EX flags", "C. Lua script: INCR + set EXPIRE only on first call", "D. MULTI/EXEC block"], "answer": "C", "explanation": "<b>Race condition</b>: Between INCR and EXPIRE, another client reads without TTL. <b>Lua script</b> (atomic): <code>local c=redis.call('INCR',KEYS[1]); if c==1 then redis.call('EXPIRE',KEYS[1],ARGV[1]) end; return c</code>. The script runs atomically — no interleaving. Used for rate limiting: increment on first call, set TTL, check on subsequent calls within the window."}, {"id": 66, "topic": "redis", "q": "Redis MULTI/EXEC block provides:", "options": ["A. Multi-key operations", "B. Atomic execution of queued commands without interruption", "C. Pub/sub for multiple channels", "D. Multi-node connection"], "answer": "B", "explanation": "<b>MULTI/EXEC</b>: <code>MULTI</code> queues subsequent commands. <code>EXEC</code> executes all atomically. <code>DISCARD</code> aborts. All or nothing — no partial execution. <b>WATCH</b> adds optimistic locking: if watched key changes before EXEC, transaction aborts (CAS). Unlike RDBMS, Redis transactions don't rollback on runtime errors. Lua scripts preferred for complex atomic operations."}, {"id": 67, "topic": "redis", "q": "Redis Geo commands (GEOADD, GEORADIUS) are built on top of which data structure?", "options": ["A. Hash", "B. Sorted Set — geo coordinates encoded as score using Geohash", "C. List", "D. Bit array"], "answer": "B", "explanation": "<b>Redis Geo</b>: Geo coordinates encoded as 52-bit Geohash integers stored as Sorted Set scores. <code>GEOADD locations 77.5946 12.9716 'Bangalore'</code>. <code>GEORADIUS locations 77.5946 12.9716 50 km ASC</code> — find all within 50km. Used for: nearby driver search (Uber), location-based search, delivery radius queries. Precision: ~0.6m at scale."}, {"id": 68, "topic": "redis", "q": "What does 'cache penetration' mean?", "options": ["A. An attacker bypassing Redis auth", "B. Repeated queries for non-existent keys that bypass cache and always hit the DB", "C. Cache running out of memory", "D. Slow cache reads"], "answer": "B", "explanation": "<b>Cache penetration</b>: Requests for keys that don't exist in cache OR DB (e.g., IDs that never existed) — cache misses every time, hammering the DB. Solutions: <b>Bloom Filter</b> (check if key could exist before querying DB — false positives acceptable, no false negatives), <b>Cache null values</b> with short TTL (cache 'not found' result), <b>Input validation</b> (reject clearly invalid IDs)."}, {"id": 69, "topic": "redis", "q": "Redis Bit operations (SETBIT, GETBIT, BITCOUNT) are most suitable for:", "options": ["A. Storing binary files", "B. Compact boolean flags per user (e.g., daily active users, feature flags per userId)", "C. Encrypting data", "D. Storing IP addresses"], "answer": "B", "explanation": "<b>Redis Bitmaps</b>: Each bit represents a boolean per offset (e.g., userId). <code>SETBIT user:active:2024-01-01 userId 1</code>. <code>BITCOUNT user:active:2024-01-01</code> = total active users that day. <code>BITOP AND result key1 key2</code> = users active on both days. 1 bit per user — extremely compact (100M users = 12.5MB). Used at Twitter/Facebook for DAU counting."}, {"id": 70, "topic": "redis", "q": "What is the purpose of Redis Pipeline?", "options": ["A. Data transformation pipeline", "B. Batch multiple commands in one network round trip to reduce RTT overhead", "C. Replicate commands to replicas", "D. Priority-based command execution"], "answer": "B", "explanation": "<b>Redis Pipeline</b>: Send multiple commands to Redis in a single network request without waiting for each response. Redis processes them sequentially and returns all responses at once. Reduces <b>RTT (round-trip time)</b> overhead — critical for high-throughput batch operations. <b>Not atomic</b> (unlike MULTI/EXEC). Use when you have many independent commands and RTT is the bottleneck."}, {"id": 71, "topic": "redis", "q": "Write-back (write-behind) caching strategy risks:", "options": ["A. Higher write latency", "B. Data loss if cache fails before async flush to DB", "C. Cache always stale", "D. DB overload on writes"], "answer": "B", "explanation": "<b>Write-back</b>: Write to cache only; async background flush to DB. <b>Best write performance</b> (cache speed, not DB speed). <b>Risk</b>: If cache fails (OOM eviction, crash) before flushing, data is permanently lost. Mitigate: use Redis with AOF persistence, write to multiple cache nodes, set TTL to force flush. Use when write throughput is critical and occasional data loss is acceptable."}, {"id": 72, "topic": "redis", "q": "Redis Cluster's MOVED error means:", "options": ["A. The key has been deleted", "B. The key's hash slot has been moved to a different node; client must redirect the request", "C. The cluster is under maintenance", "D. The key is too large"], "answer": "B", "explanation": "<b>MOVED error</b>: Redis returns <code>MOVED slot ip:port</code> when a key's hash slot is served by a different node than where the client sent the request. Smart Redis clients (Lettuce, Jedis cluster-mode) automatically redirect and update their slot map. Happens during rebalancing or after node addition. <b>ASK error</b>: Temporary redirect during active slot migration (use ASKING before command on target)."}, {"id": 73, "topic": "redis", "q": "Best strategy for caching database query results that are expensive to compute?", "options": ["A. Cache forever with no TTL", "B. Cache with TTL + background refresh (stale-while-revalidate)", "C. Never cache computed results", "D. Cache only in application memory"], "answer": "B", "explanation": "<b>Stale-while-revalidate</b>: Serve stale (expired) cache while triggering a background refresh. User gets fast response; cache is updated asynchronously. Combines <b>low latency</b> with <b>eventual freshness</b>. Implementation: check TTL, if close to expiry → trigger async refresh job → return current (slightly stale) value. Used in CDNs (Cache-Control: stale-while-revalidate) and Redis with background workers."}, {"id": 74, "topic": "redis", "q": "In Redis, what does the OBJECT ENCODING command reveal?", "options": ["A. Encryption algorithm used", "B. Internal memory encoding of a key's value (e.g., ziplist, listpack, hashtable, skiplist)", "C. Network encoding", "D. Persistence encoding"], "answer": "B", "explanation": "<b>Redis encodings</b> optimize memory: <b>Small lists/hashes/sets</b> → <code>listpack</code> (compact array, Redis 7.0+) or <code>ziplist</code>. <b>Large lists</b> → <code>linkedlist</code>/<code>quicklist</code>. <b>Large hashes</b> → <code>hashtable</code>. <b>Sorted sets</b> → <code>listpack</code> (small) or <code>skiplist+hashtable</code> (large). Exceeding hash-max-listpack-entries/value thresholds triggers conversion to larger encoding. Knowing this helps optimize memory usage."}, {"id": 75, "topic": "redis", "q": "What is the recommended approach for Redis high availability in a production Kubernetes deployment?", "options": ["A. Single Redis pod with persistent volume", "B. Redis Sentinel (3 sentinels + master/replicas) or Redis Cluster via Helm chart (e.g., Bitnami)", "C. Multiple independent Redis pods with no coordination", "D. Redis with a sidecar for HA"], "answer": "B", "explanation": "<b>Production Redis on Kubernetes</b>: <b>Redis Sentinel</b>: Use Bitnami Helm chart; 3 sentinel pods + 1 master + N replicas. Clients connect via Sentinel for automatic master discovery. <b>Redis Cluster</b>: 6+ pods (3 masters, 3 replicas minimum). Use StatefulSets for stable network identity. Consider: <b>Redis Operator</b> (Redis Enterprise, spotahome), persistent volumes for AOF/RDB, resource limits, and anti-affinity rules to spread pods across nodes."}, {"id": 76, "topic": "databases", "q": "What problem does database connection pooling solve?", "options": ["A. Slow query execution", "B. The overhead of creating new DB connections on every request (expensive TCP + auth handshake)", "C. Data replication lag", "D. Schema migration conflicts"], "answer": "B", "explanation": "<b>Connection pooling</b>: Maintains a pool of open DB connections reused across requests. Creating a new connection involves TCP handshake + TLS + authentication — expensive (10-100ms). Pool: keep N connections alive, borrow/return on request. Libraries: HikariCP (Java — fastest), pgBouncer (PostgreSQL proxy-level pooling), c3p0. Key configs: min/max pool size, connection timeout, max lifetime, idle timeout. Pgbouncer transaction mode allows >10k connections on PostgreSQL."}, {"id": 77, "topic": "databases", "q": "In PostgreSQL, MVCC (Multi-Version Concurrency Control) works by:", "options": ["A. Locking rows on reads", "B. Keeping multiple versions of a row, allowing concurrent reads without blocking writes", "C. Storing all changes in a WAL file only", "D. Using optimistic locking for all transactions"], "answer": "B", "explanation": "<b>MVCC</b>: Each transaction sees a snapshot of the database at a point in time. Writes create new row versions (with xmin/xmax transaction IDs) rather than modifying in place. Readers see the snapshot without locking rows; writers don't block readers. Garbage collection (VACUUM) removes old versions no longer needed by any transaction. Enables: high read concurrency, consistent reads in long transactions."}, {"id": 78, "topic": "databases", "q": "What is a covering index in SQL databases?", "options": ["A. An index on all columns of a table", "B. An index that contains all columns needed for a query, eliminating the need to access the table", "C. A partial index on a subset of rows", "D. An index that spans multiple tables"], "answer": "B", "explanation": "<b>Covering Index</b>: Includes all columns referenced in a query (SELECT, WHERE, ORDER BY, GROUP BY) so the DB can satisfy the query from the index alone without a heap fetch. In PostgreSQL: <code>CREATE INDEX idx ON orders(user_id, status, created_at)</code> — covering for <code>SELECT user_id, status, created_at FROM orders WHERE user_id=1</code>. Eliminates 'table access by index rowid' (most expensive part). Significant performance boost for read-heavy queries."}, {"id": 79, "topic": "databases", "q": "What does 'N+1 query problem' mean in ORM-backed services?", "options": ["A. Running the same query N+1 times for N records in a loop — causing N+1 DB round trips", "B. Having N+1 indexes on a table", "C. A query taking N+1 seconds", "D. Having N+1 concurrent connections"], "answer": "A", "explanation": "<b>N+1 problem</b>: Fetch N parent records (1 query), then for each parent fetch its children individually (N queries) = N+1 total queries. Example: Load 100 orders (1 query) → for each order load items (100 queries) = 101 queries. Fix: <b>JOIN</b> or <b>eager loading</b> (Hibernate: <code>@BatchSize</code>, JPQL <code>JOIN FETCH</code>, Spring Data: <code>@EntityGraph</code>). Detect: Hibernate SQL logging, Datadog DB traces, p6spy."}, {"id": 80, "topic": "databases", "q": "Database index on column with low cardinality (e.g., boolean, gender) is generally:", "options": ["A. Always beneficial", "B. Often not helpful — full table scan may be faster due to poor selectivity", "C. The best type of index", "D. Only useful for sorted data"], "answer": "B", "explanation": "<b>Cardinality and index selectivity</b>: Index is most beneficial when it filters a large portion of rows (high cardinality, high selectivity). Low cardinality (e.g., boolean: true/false, 50/50 split) → index scan + heap fetch may be slower than a sequential scan because the DB must access many pages anyway. <b>Partial index</b> helps: <code>CREATE INDEX idx ON users(status) WHERE status='pending'</code> — only indexes the rare case."}, {"id": 81, "topic": "databases", "q": "PostgreSQL EXPLAIN ANALYZE shows 'Seq Scan' when:", "options": ["A. The query uses indexes", "B. No suitable index exists or query planner decides sequential scan is faster", "C. The table is empty", "D. The query uses JOINs"], "answer": "B", "explanation": "<b>Seq Scan (Sequential Scan)</b>: Reads every row in the table. Query planner chooses it when: no applicable index exists, the query returns a large fraction of rows (index scan would be slower), or the table is small enough that seq scan is faster. To force index: <code>SET enable_seqscan = OFF</code> (testing only). Check: <code>EXPLAIN (ANALYZE, BUFFERS) SELECT ...</code> — look for actual rows vs estimated rows, hit vs read buffers."}, {"id": 82, "topic": "databases", "q": "What is write amplification in LSM-tree databases (e.g., Cassandra, RocksDB)?", "options": ["A. Multiple writes from a single client", "B. The ratio of actual data written to disk vs logical data written by the application (due to compaction)", "C. Write errors causing retries", "D. Replication factor multiplying writes"], "answer": "B", "explanation": "<b>LSM-tree (Log-Structured Merge-tree)</b>: Writes go to MemTable (memory) → flushed to SSTables (disk). <b>Compaction</b> merges and rewrites SSTables — data is written multiple times. <b>Write amplification</b> = total bytes written to disk / bytes written by app. High WA increases SSD wear and I/O. Tradeoff: LSM has high write throughput (sequential writes) but high WA from compaction. B-tree (PostgreSQL): lower WA but slower writes (random I/O, MVCC overhead)."}, {"id": 83, "topic": "databases", "q": "In database sharding, 'hot shard' problem occurs when:", "options": ["A. A shard runs on overheated hardware", "B. One shard receives disproportionately more traffic due to skewed shard key distribution", "C. A shard has too many replicas", "D. Shards are too large"], "answer": "B", "explanation": "<b>Hot shard</b>: Poor shard key choice leads to uneven data/traffic distribution. Example: Shard by user country — if 80% users are from one country, that shard is a hotspot. Fix: Use <b>composite shard keys</b>, <b>hash-based sharding</b> (uniform distribution), or <b>virtual shards</b> (many more virtual shards than physical — reshard by moving virtual shards). Consistent hashing mitigates this in distributed caches."}, {"id": 84, "topic": "databases", "q": "What is a materialized view in databases?", "options": ["A. A virtual view that runs on query", "B. A precomputed, physically stored query result that can be indexed and refreshed", "C. A view on materialized data types", "D. A read-only replica"], "answer": "B", "explanation": "<b>Materialized View</b>: Stores the query result on disk (unlike a regular view which reruns the query). Can be indexed. <b>Refresh</b>: <code>REFRESH MATERIALIZED VIEW CONCURRENTLY</code> (PostgreSQL — no lock, uses more resources). Use for: expensive aggregate queries (dashboards), denormalized read models (CQRS), reporting. Trade-off: stale data between refreshes, additional storage. Popular in analytical workloads and data warehouses."}, {"id": 85, "topic": "databases", "q": "CAP theorem: Cassandra (AP) vs HBase (CP) — what does each sacrifice?", "options": ["A. Cassandra sacrifices Availability; HBase sacrifices Consistency", "B. Cassandra sacrifices Consistency (eventual); HBase sacrifices Availability (may reject writes during partition)", "C. Both sacrifice Partition Tolerance", "D. They are both CA systems"], "answer": "B", "explanation": "<b>Cassandra (AP)</b>: Always available, always accepts writes (eventual consistency). During partition, replicas may diverge (tunable consistency: ONE, QUORUM, ALL). <b>HBase (CP)</b>: Prioritizes consistency — during a partition, HBase may refuse writes to maintain consistency (relies on ZooKeeper for coordination). <b>DynamoDB</b> (AP with optional strong reads), <b>Spanner</b> (effectively CA with TrueTime — external consistency)."}, {"id": 86, "topic": "databases", "q": "What is the difference between optimistic and pessimistic locking?", "options": ["A. No difference", "B. Optimistic: lock only on write conflict (version check); Pessimistic: lock row/table immediately on read", "C. Optimistic uses DB locks; Pessimistic uses application locks", "D. Optimistic is for NoSQL; Pessimistic for SQL"], "answer": "B", "explanation": "<b>Optimistic Locking</b>: No lock on read. On write, check if version/timestamp changed → if yes, retry. Low overhead, good for low-contention scenarios. JPA: <code>@Version</code> field. <b>Pessimistic Locking</b>: Lock row immediately (<code>SELECT ... FOR UPDATE</code>) — blocks other writers. Good for high-contention scenarios. Trade-off: optimistic = more retries under high contention; pessimistic = guaranteed no conflict but may cause deadlocks."}, {"id": 87, "topic": "databases", "q": "Database index type best suited for range queries (e.g., created_at BETWEEN):", "options": ["A. Hash index", "B. B-tree index", "C. Bitmap index", "D. Full-text index"], "answer": "B", "explanation": "<b>B-tree index</b>: Ordered tree structure — supports equality, range (<, >, BETWEEN), ORDER BY, MIN/MAX efficiently. Default index type in PostgreSQL, MySQL. <b>Hash index</b>: Only equality lookups (=), not ranges. <b>Bitmap index</b>: Good for low-cardinality in data warehouses (Oracle). <b>GIN/GiST</b> (PostgreSQL): Full-text, JSONB, array operators. <b>BRIN</b>: Block Range Index — good for naturally ordered data (time-series) with very low storage cost."}, {"id": 88, "topic": "databases", "q": "What is database connection pool exhaustion and how does it manifest?", "options": ["A. Database storage is full", "B. All pool connections are in use; new requests timeout waiting — causing request failures/latency spikes", "C. Too many indexes", "D. Disk I/O saturation"], "answer": "B", "explanation": "<b>Pool exhaustion</b>: All connections borrowed and not returned. Symptoms: requests queue, timeout after pool-checkout-timeout (HikariCP default 30s), exceptions like 'Connection pool exhausted'. Causes: Long-running transactions holding connections, slow queries, connection leaks. Fix: Tune pool size, add connection timeout alerts, use pgBouncer (transaction mode allows 10k+ app connections on few DB connections), fix slow queries."}, {"id": 89, "topic": "databases", "q": "What is the purpose of a WAL (Write-Ahead Log) in PostgreSQL?", "options": ["A. Caching writes in memory", "B. Durability and crash recovery — changes are logged before being applied to data pages", "C. Replication only", "D. Index maintenance"], "answer": "B", "explanation": "<b>WAL (Write-Ahead Log)</b>: PostgreSQL writes changes to the WAL (sequential, durable) before applying to data pages. On crash: replay WAL from last checkpoint to recover. Also used for: <b>Replication</b> (streaming replicas consume WAL), <b>Logical replication</b> (Debezium CDC), <b>PITR</b> (Point-in-Time Recovery). WAL_level settings: minimal, replica, logical. WAL writes are sequential (fast); data page writes are random (slower)."}, {"id": 90, "topic": "databases", "q": "In MongoDB, what is the difference between embedded documents and document references?", "options": ["A. Embedded = stored in separate collection; reference = inline", "B. Embedded = inline in same document (denormalized); reference = separate document with ID link (normalized)", "C. No functional difference", "D. References are only for arrays"], "answer": "B", "explanation": "<b>Embedded documents</b>: Denormalized — child data stored inside parent document. Pros: single read, atomic writes. Cons: document size limit (16MB), duplication. <b>References</b>: Normalized — store ID and use <code>$lookup</code> (like JOIN). Pros: no duplication, no size limit. Cons: multiple queries. Rule of thumb: embed for 'one-to-few' (user→addresses); reference for 'one-to-many/many-to-many' (user→orders where orders are large)."}, {"id": 91, "topic": "databases", "q": "What is read replica lag and how does it affect application design?", "options": ["A. Slow read queries on primary", "B. Delay between primary write and replica reflecting that write — stale reads possible from replicas", "C. Network latency to the DB", "D. Slow index rebuilds"], "answer": "B", "explanation": "<b>Replication lag</b>: Replicas apply WAL/binlog changes asynchronously — may be seconds behind. Affects: <b>Read-after-write consistency</b> — user writes data, reads from replica, gets stale version. Mitigations: <b>Read your own writes</b> (route writes + immediate reads to primary), <b>Sticky sessions</b> (same user always hits primary for a window), <b>Synchronous replication</b> (lag=0 but higher write latency), <b>Wait-for-lag</b> (check replica lag before routing)."}, {"id": 92, "topic": "databases", "q": "What does 'eventual consistency' mean in DynamoDB?", "options": ["A. Data is immediately consistent across all replicas", "B. After a write, reads may return stale data until all replicas sync (typically within milliseconds)", "C. DynamoDB never achieves consistency", "D. Only one replica is ever updated"], "answer": "B", "explanation": "<b>DynamoDB eventual consistency</b> (default): Reads may return slightly stale data (milliseconds typically) as replicas sync across 3 AZs. <b>Strong consistency</b>: Request reads from leader replica — always latest, but 2× read capacity units and slightly higher latency. Choose: eventual for most reads (cheaper, faster); strong for critical reads (inventory checks, financial balances). DynamoDB replicates synchronously within an AZ, async across AZs."}, {"id": 93, "topic": "databases", "q": "Database indexing strategy: which columns should be indexed first in a composite index?", "options": ["A. Highest cardinality column", "B. Most frequently filtered column (equality first, then range)", "C. Alphabetically first column", "D. The primary key column"], "answer": "B", "explanation": "<b>Composite index column order</b>: Follow the <b>selectivity + query pattern</b> rule. Equality conditions should come first (high filter selectivity), range conditions last. Example: <code>WHERE user_id=1 AND status='active' AND created_at > '2024-01-01'</code> → index: <code>(user_id, status, created_at)</code>. Also follow the query pattern — the index is only used from the leftmost prefix. <code>INDEX(a,b,c)</code> supports queries on <code>a</code>, <code>a,b</code>, <code>a,b,c</code> but not <code>b,c</code> alone."}, {"id": 94, "topic": "databases", "q": "What is the purpose of database partitioning (table partitioning)?", "options": ["A. Reduce number of columns", "B. Split a large table into smaller physical pieces for better query performance and maintenance", "C. Replace indexes", "D. Enable multi-tenant isolation"], "answer": "B", "explanation": "<b>Table partitioning</b> (PostgreSQL declarative, MySQL): Split large tables by range, list, or hash. Benefits: <b>Partition pruning</b> (queries only scan relevant partitions — huge speedup for time-series), <b>Faster maintenance</b> (DROP old partition = instant vs DELETE millions of rows), <b>Better I/O</b> (recently accessed partitions stay in cache). Example: Partition <code>events</code> by month — queries for this month only scan one partition."}, {"id": 95, "topic": "databases", "q": "In distributed databases, what is a 'quorum' for reads and writes?", "options": ["A. The number of replicas", "B. The minimum number of replicas that must respond for an operation to succeed", "C. A consensus algorithm", "D. A distributed lock mechanism"], "answer": "B", "explanation": "<b>Quorum</b>: For N replicas, quorum = N/2 + 1. <b>Write quorum (W)</b>: min replicas that must ack a write. <b>Read quorum (R)</b>: min replicas that must respond to a read. <b>Strong consistency</b>: W + R > N (read always sees latest write). Cassandra: tune W and R per operation (ONE, QUORUM=N/2+1, ALL). Higher W+R = stronger consistency but lower availability. Cassandra default: R=1, W=1 (eventual); QUORUM+QUORUM = strong."}, {"id": 96, "topic": "databases", "q": "PostgreSQL JSONB vs JSON column type — key difference:", "options": ["A. JSONB is text; JSON is binary", "B. JSONB is stored as decomposed binary (indexed, faster queries); JSON stored as text (preserves order/whitespace)", "C. No practical difference", "D. JSONB only for arrays; JSON for objects"], "answer": "B", "explanation": "<b>JSONB</b>: Parsed and stored in decomposed binary format. Supports <b>GIN indexing</b> for efficient querying (<code>@></code>, <code>?</code>, <code>?&</code>). Slightly slower to write (parsing overhead), faster to query. <b>JSON</b>: Stored as-is (preserves key order, whitespace). No GIN index support. Faster write, slower query. <b>Always prefer JSONB</b> unless you need exact input preservation. Index: <code>CREATE INDEX idx ON table USING GIN (col)</code>."}, {"id": 97, "topic": "databases", "q": "What is database denormalization and when is it appropriate?", "options": ["A. Removing all foreign keys", "B. Intentionally introducing redundancy for read performance at the cost of update complexity", "C. Converting SQL to NoSQL", "D. Splitting tables into smaller ones"], "answer": "B", "explanation": "<b>Denormalization</b>: Store precomputed or duplicated data to avoid expensive JOINs. Examples: store <code>order_count</code> on user record (avoid COUNT query), duplicate user name in orders table (avoid JOIN). <b>Appropriate when</b>: Read-heavy workloads, JOINs are too slow, data rarely changes. <b>Cost</b>: Update anomalies (must update all copies), storage overhead. Used in CQRS read models, NoSQL designs, reporting tables."}, {"id": 98, "topic": "databases", "q": "What is a 'phantom read' in database transactions?", "options": ["A. A read that fails silently", "B. A transaction reads a set of rows, another transaction inserts rows matching the filter, re-read returns different rows", "C. Reading deleted rows", "D. A dirty read of uncommitted data"], "answer": "B", "explanation": "<b>Transaction isolation anomalies</b>: <b>Dirty read</b>: Read uncommitted data. <b>Non-repeatable read</b>: Re-read same row gets different value (another tx updated it). <b>Phantom read</b>: Re-execute same query gets different rows (another tx inserted/deleted matching rows). Isolation levels: READ UNCOMMITTED (all anomalies), READ COMMITTED (prevents dirty reads), REPEATABLE READ (prevents dirty+non-repeatable), SERIALIZABLE (prevents all including phantoms — uses range locks/predicate locks)."}, {"id": 99, "topic": "databases", "q": "Cassandra is optimized for which access pattern?", "options": ["A. Complex multi-table JOINs", "B. High write throughput with partition key-based lookups; design tables for specific queries", "C. Ad-hoc analytical queries", "D. Strict ACID transactions"], "answer": "B", "explanation": "<b>Cassandra design</b>: <b>Write optimized</b> — LSM tree, no locks, always writable (AP). <b>Query-first modeling</b>: Design tables for specific queries (denormalized). Each table = one query pattern. Primary key = partition key + clustering columns. <b>Anti-patterns</b>: No JOINs, no WHERE on non-primary-key columns (without ALLOW FILTERING, which is slow), no transactions across partitions. Best for: time-series, write-heavy, globally distributed, IoT data."}, {"id": 100, "topic": "databases", "q": "What is a 'slow query log' used for in MySQL/PostgreSQL?", "options": ["A. Logging all queries for audit", "B. Logging queries exceeding a time threshold for performance investigation and index optimization", "C. Logging failed queries", "D. Logging DDL statements"], "answer": "B", "explanation": "<b>Slow query log</b>: MySQL: <code>slow_query_log=ON</code>, <code>long_query_time=1</code> (seconds). PostgreSQL: <code>log_min_duration_statement=1000</code> (ms). Captures: query text, execution time, rows examined. Analyze with: <b>mysqldumpslow</b>, <b>pt-query-digest</b> (Percona), <b>pgBadger</b> (PostgreSQL). Findings lead to: index additions, query rewrites, schema optimization. Combined with EXPLAIN ANALYZE for root cause diagnosis."}, {"id": 101, "topic": "sysdesign", "q": "How would you design a URL shortener (like bit.ly) at scale?", "options": ["A. Store long URL as key, short code as value in RDBMS only", "B. Hash/encode to short code, store in DB + cache popular URLs in Redis, use 302/301 redirect", "C. Use sequential IDs only with no caching", "D. Store everything in memory"], "answer": "B", "explanation": "<b>URL Shortener design</b>: 1) <b>Encoding</b>: Base62 encode a unique ID (counter or UUID) → 7-char code = 62^7 = 3.5T URLs. 2) <b>Storage</b>: DB (code→URL) + Redis cache (hot URLs). 3) <b>Redirect</b>: 302 (temporary, tracks clicks) or 301 (permanent, browser caches). 4) <b>Scale</b>: Read-heavy (100:1 read/write ratio) → cache aggressively. 5) <b>Counter generation</b>: Distributed ID generator (Snowflake) to avoid collisions. 6) <b>Analytics</b>: Async click tracking via Kafka → time-series DB."}, {"id": 102, "topic": "sysdesign", "q": "What is consistent hashing and why is it used in distributed caching?", "options": ["A. A hash function that always returns the same value", "B. Distributes keys across nodes on a ring; adding/removing nodes only remaps 1/N keys", "C. Ensures all nodes get equal traffic", "D. A load balancing algorithm for HTTP"], "answer": "B", "explanation": "<b>Consistent Hashing</b>: Nodes and keys are placed on a virtual ring (0 to 2^32). Each key is assigned to the first node clockwise from its hash. Adding/removing a node only remaps keys from/to adjacent nodes (1/N keys) — vs. modular hashing (remaps all keys). Used in: Memcached, Redis Cluster (virtual nodes/slots), DynamoDB, Cassandra. <b>Virtual nodes</b>: Each physical node owns multiple ring points for better balance."}, {"id": 103, "topic": "sysdesign", "q": "How do you design a rate limiter for a public API serving 10M requests/day?", "options": ["A. Count requests in application memory", "B. Token bucket or sliding window counter in Redis with per-user keys and TTL", "C. Use a database table for counting", "D. Block IPs that exceed limits at DNS level"], "answer": "B", "explanation": "<b>Rate Limiter</b>: Use Redis for distributed counting. <b>Fixed window</b>: <code>INCR user:rate:userId:minute</code> + <code>EXPIRE</code>. <b>Sliding window</b>: Redis Sorted Set with timestamps as score, remove old entries, count remaining. <b>Token bucket</b>: Store tokens + last_refill_time in Redis hash, atomically update with Lua script. Expose <code>X-RateLimit-Limit</code>, <code>X-RateLimit-Remaining</code>, <code>X-RateLimit-Reset</code> headers. Apply at API gateway level."}, {"id": 104, "topic": "sysdesign", "q": "What is the key design consideration for a distributed ID generator (like Twitter Snowflake)?", "options": ["A. IDs must be human-readable", "B. IDs must be globally unique, time-sortable, and generated without coordination", "C. IDs must be sequential integers", "D. IDs must be UUIDs"], "answer": "B", "explanation": "<b>Snowflake ID</b> (64-bit): <b>41 bits</b> timestamp (ms, 69-year range), <b>10 bits</b> machine ID (1024 nodes), <b>12 bits</b> sequence (4096 IDs/ms/node). Globally unique without coordination. Time-sortable (IDs increase over time). <b>4 million IDs/sec</b> per node. Variants: Sonyflake (Go), Instagram ID, ULID (base32 encoded, URL-safe). Problem: clock skew — if clock moves backwards, IDs could collide (wait or throw exception)."}, {"id": 105, "topic": "sysdesign", "q": "How would you design a notification system for 100M users?", "options": ["A. Direct HTTP push to each user's device from the API server", "B. Event-driven: API → Kafka → per-channel workers (push/email/SMS) with user preference routing", "C. Store notifications in DB and poll every second", "D. Use a single thread to send notifications sequentially"], "answer": "B", "explanation": "<b>Notification System</b>: <b>Event producer</b>: API publishes to Kafka topic. <b>Workers</b>: Separate consumers per channel (push, email, SMS, in-app) — each scales independently. <b>User preferences</b>: Check preference service before sending. <b>Push notifications</b>: FCM (Android), APNs (iOS) via worker. <b>Rate limiting</b>: Don't spam users (max N notifications/hour). <b>Deduplication</b>: Idempotency keys to prevent duplicate sends. <b>Priority queues</b>: Separate queues for critical vs marketing."}, {"id": 106, "topic": "sysdesign", "q": "What is a CDN and how does it reduce latency for global users?", "options": ["A. A distributed cache at the application layer", "B. A network of geographically distributed edge servers caching static/dynamic content close to users", "C. A database replication strategy", "D. A microservice for content management"], "answer": "B", "explanation": "<b>CDN (Content Delivery Network)</b>: Edge servers in 100s of PoPs (Points of Presence) globally. Static content (JS, CSS, images, videos) cached at edge — served from nearest PoP (30-50ms) vs. origin (200-500ms). <b>Cache miss</b>: Edge fetches from origin, caches response. <b>Cache invalidation</b>: URL versioning (hash in filename),
