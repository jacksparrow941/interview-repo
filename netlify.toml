[build]
  # Build command: run the Python site generator
  command = "python generate_site.py"
  # Folder to publish (the generated static output)
  publish = "InterviewRepository"

[build.environment]
  PYTHON_VERSION = "3.11"

# Redirect rules (optional — SPA-style fallback not needed for static)
# All pages are real files, so no redirects required

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
